// ── IndexedDB DB (OFFLINE ONLY — no Google Sheets sync, no data caps like localStorage) ──
// Storage limit yahan localStorage jaisa 5-10MB nahi hai — ye disk space tak use kar sakta hai.
const IDB = {
  _dbPromise: null,
  _open(){
    if(this._dbPromise) return this._dbPromise;
    this._dbPromise = new Promise((resolve,reject)=>{
      const req = indexedDB.open("jpl_idb", 1);
      req.onupgradeneeded = ()=>{ if(!req.result.objectStoreNames.contains("kv")) req.result.createObjectStore("kv"); };
      req.onsuccess = ()=>resolve(req.result);
      req.onerror = ()=>reject(req.error);
    });
    return this._dbPromise;
  },
  async get(key){
    const db = await this._open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readonly");
      const req = tx.objectStore("kv").get(key);
      req.onsuccess = ()=>resolve(req.result===undefined?null:req.result);
      req.onerror = ()=>reject(req.error);
    });
  },
  async set(key,value){
    const db = await this._open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readwrite");
      tx.objectStore("kv").put(value,key);
      tx.oncomplete = ()=>resolve(true);
      tx.onerror = ()=>reject(tx.error);
    });
  },
  async keys(){
    const db = await this._open();
    return new Promise((resolve,reject)=>{
      const tx = db.transaction("kv","readonly");
      const req = tx.objectStore("kv").getAllKeys();
      req.onsuccess = ()=>resolve(req.result||[]);
      req.onerror = ()=>reject(req.error);
    });
  }
};
// One-time migration: purana localStorage ka saara "jpl_" data IndexedDB me copy karo, kuch delete nahi hota.
async function migrateLocalStorageToIDB(){
  if(localStorage.getItem("jpl_idb_migrated_v1"))return;
  try{
    const keys=Object.keys(localStorage).filter(k=>k.startsWith("jpl_")&&k!=="jpl_idb_migrated_v1");
    for(const k of keys){
      let val=null;
      try{ val=JSON.parse(localStorage.getItem(k)); }catch{ val=localStorage.getItem(k); }
      await IDB.set(k,val);
    }
    localStorage.setItem("jpl_idb_migrated_v1","1");
  }catch(e){ console.error("Migration error",e); }
}
// ── FINANCIAL YEAR (year-wise data) ──────────────────────────
// Base year purane (bina prefix wale) keys use karta hai, isliye purana data jyon ka tyon rehta hai.
const YEAR_DBKEYS=new Set(["packings","dispatches","pos","mt_pos","mt_dispatches","mt_packings","production_plans","mt_production_plans","store_ledger","grns","gate_passes","recycle_bin","invoices","credit_notes","debit_notes"]);
const FY={label:"",prefix:"",base:"",years:[]};
const yk=k=>(FY.prefix&&YEAR_DBKEYS.has(k))?FY.prefix+k:k;
function fyCurrentLabel(d){const dt=d||new Date();const y=dt.getFullYear(),m=dt.getMonth();const st=m>=3?y:y-1;return st+"-"+String((st+1)%100).padStart(2,"0");}
function fyNextLabel(l){const y=parseInt(l,10);return (y+1)+"-"+String((y+2)%100).padStart(2,"0");}
function fyStartDate(l){const y=parseInt(l,10);return isNaN(y)?new Date().toISOString().slice(0,10):y+"-04-01";}
function fyValid(l){const m=/^(\d{4})-(\d{2})$/.exec(String(l||""));return !!m&&((parseInt(m[1],10)+1)%100)===parseInt(m[2],10);}
function fyShort(l){return String(l||"").replace(/^\d{2}(\d{2}-\d{2})$/,"$1");}
function fyLatest(){return FY.years.map(y=>y.label).sort().slice(-1)[0]||FY.label;}
function fyScreen(inner){document.getElementById("root").innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a237e,#283593);padding:16px"><div style="background:#fff;border-radius:16px;padding:32px 36px;width:420px;max-width:94vw;box-shadow:0 20px 60px rgba(0,0,0,.3);font-family:Arial,sans-serif">${inner}</div></div>`;}

}
function fySetupScreen(){

async function fySetupSave(){

  location.reload();
}

}

  return`<div style="position:fixed;top:12px;right:12px;background:rgba(255,255,255,.96);padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;color:#1a237e;box-shadow:0 2px 10px rgba(0,0,0,.25);z-index:50">📅 FY ${FY.label}${FY.years.length>1?` · <a href="#" onclick="fyChangeYear();return false" style="color:#c62828">Year badlo</a>`:""}</div>`;
}
// Poora backup: chalu year + baaki saare years (multi-device restore ke liye)
async function buildFullBackup(){
  const backup=buildBackupData();
  backup._meta.fy=FY.label;
  backup.data.fy_registry={base:FY.base,years:FY.years};
  const others={};
  for(const y of FY.years){
    if(y.label===FY.label)continue;
    const o={};
    for(const k of YEAR_DBKEYS){ try{ const v=await IDB.get("jpl_"+(y.prefix||"")+k); if(v!==null&&v!==undefined)o[k]=v; }catch(e){} }
    others[y.label]={prefix:y.prefix||"",data:o};
  }
  if(Object.keys(others).length)backup.fyData=others;
  return backup;
}

const DB = {
  async get(key){ try{ return await IDB.get("jpl_"+yk(key)); }catch(e){ console.error(e); return null; } },
  async saveRaw(key,data){
    try{ await IDB.set("jpl_"+key,data); }
    catch(e){ console.error(e); alert("⚠️ SAVE FAILED!\n\nError: "+(e&&e.message?e.message:e)); }
  },
  async save(key,data){
    try{ await IDB.set("jpl_"+yk(key),data); }
    catch(e){ console.error(e); alert("⚠️ SAVE FAILED! Ye entry save NAHI hui hai.\n\nError: "+(e&&e.message?e.message:e)); }
  }
};

// ── TOMBSTONE — permanently remembers deleted ids so they never resurrect ──
const Tombstone = {
  _key: "jpl_deleted_ids",
  get()  { try { return JSON.parse(localStorage.getItem(this._key)||"{}"); } catch { return {}; } },
  set(t) { try { localStorage.setItem(this._key, JSON.stringify(t)); } catch(e){} },
  add(dbKey, id) {
    dbKey = yk(dbKey);
    const t = this.get();
    if(!Array.isArray(t[dbKey])) t[dbKey] = [];
    if(!t[dbKey].includes(id)) t[dbKey].push(id);
    this.set(t);
  },
  filterOut(dbKey, arr) {
    const t = this.get();
    const dead = t[dbKey];
    if(!Array.isArray(dead) || !dead.length || !Array.isArray(arr)) return arr;
    return arr.filter(item => !dead.includes(item?.id));
  }
};

async function persist(key, data) {
  await DB.save(key, data);
}

const fmtDate  = d=>d?new Date(d).toLocaleDateString("en-IN"):"";

// Carton number ke baad /year (jaise 947/26-27). Pichhle saal se aaye cartons ka number me year pehle se hota hai.
function cartonLabel(no){const t=String(no==null?"":no).trim();if(!t)return"";return t.indexOf("/")>=0?t:t+"/"+fyShort(FY.label);}
function cartonMatch(no,q){const raw=String(no==null?"":no).trim(),qq=String(q==null?"":q).trim();if(!qq)return true;if(raw===qq||cartonLabel(raw)===qq)return true;return qq.indexOf("/")<0&&raw.indexOf(qq+"/")===0;}
// Shared Challan sequence — General Dispatch aur MT Dispatch dono ek hi counter use karte hain.
// Ye purane data (max) se nahi, seedha admin-set counter (nextChallanOverride) se chalta hai — har save hote hi khud +1 ho jaata hai.
const genSharedChallan = ()=>Number(state.nextChallanOverride)||1001;
const genChallan = genSharedChallan;
const genMtChal  = genSharedChallan;
function bumpChallanCounter(challanNo){
  const n=Number(challanNo);
  if(n&&n>=Number(state.nextChallanOverride||0)){
    state.nextChallanOverride=n+1;
    persist("next_challan_override",state.nextChallanOverride);
  }

  const data=enc.encode(salt+":"+password);

  return Array.from(new Uint8Array(hashBuffer)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
async function extractTextFromPdfDataUrl(dataUrl){
  if(!dataUrl||!dataUrl.startsWith("data:application/pdf")||!window.pdfjsLib)return"";
  try{
    const base64=dataUrl.split(",")[1];
    const binary=atob(base64);
    const bytes=new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
    const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
    let fullText="";
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p);
      const content=await page.getTextContent();
      fullText+=content.items.map(it=>it.str).join(" ")+"\n";
    }
    return fullText;
  }catch(e){ console.error("PDF extract error",e); return""; }
}
function extractPoValueFromText(text){
  if(!text)return null;
  const patterns=[
    /P\.?\s?O\.?\s*Value[:\s]*(?:Rs\.?|₹|INR)?\s*([\d,]+\.\d{1,2}|[\d,]+)/i,
    /Total\s*PO\s*Value[:\s]*(?:Rs\.?|₹|INR)?\s*([\d,]+\.\d{1,2}|[\d,]+)/i,
    /Grand\s*Total[:\s]*(?:Rs\.?|₹|INR)?\s*([\d,]+\.\d{1,2}|[\d,]+)/i,
    /Net\s*Amount[:\s]*(?:Rs\.?|₹|INR)?\s*([\d,]+\.\d{1,2}|[\d,]+)/i,
    /Total\s*Amount[:\s]*(?:Rs\.?|₹|INR)?\s*([\d,]+\.\d{1,2}|[\d,]+)/i,
    /Total\s*Value[:\s]*(?:Rs\.?|₹|INR)?\s*([\d,]+\.\d{1,2}|[\d,]+)/i
  ];
  for(const re of patterns){
    const m=text.match(re);
    if(m&&m[1]){ const num=parseFloat(m[1].replace(/,/g,"")); if(!isNaN(num))return num; }
  }
  return null;
}

const _acSugg={};
const AC={
  _hi:{},
  init(id,sugg){_acSugg[id]=sugg||[];},
  open(id){AC.filter(id);const d=document.getElementById(id+"_drop");if(d)d.classList.add("open");},
  blur(id){setTimeout(()=>{const d=document.getElementById(id+"_drop");if(d)d.classList.remove("open");},200);},
  filter(id){
    const inp=document.getElementById(id),drop=document.getElementById(id+"_drop");
    if(!inp||!drop)return;
    AC._hi[id]=-1;
    const q=(inp.value||"").toLowerCase(),sugg=(_acSugg[id]||[]).filter(s=>s!=null);
    const f=sugg.filter(s=>String(s).toLowerCase().includes(q));
    drop.innerHTML=f.map(s=>`<div class="ac-item" onmousedown="AC.pick('${id}','${esc(s)}')">${esc(s)}</div>`).join("")||`<div class="ac-noresult" style="padding:8px 12px;color:#999;font-size:13px">No match</div>`;
    drop.classList.add("open");
    if(id==="dpParty")DispatchApp.onDispatchPartySelect();
    if(id==="poParty")POApp.onPOPartySelect();
  },
  keynav(id,e){
    const drop=document.getElementById(id+"_drop");
    if(!drop||!drop.classList.contains("open"))return;
    const items=[...drop.querySelectorAll(".ac-item")];
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){
      if(!items.length)return;
      e.preventDefault();
      let idx=AC._hi[id]!=null?AC._hi[id]:-1;
      idx=e.key==="ArrowDown"?Math.min(items.length-1,idx+1):Math.max(0,idx-1);
      AC._hi[id]=idx;
      items.forEach((it,i)=>it.classList.toggle("ac-active",i===idx));
      items[idx].scrollIntoView({block:"nearest"});
    }else if(e.key==="Escape"){
      drop.classList.remove("open");
    }
  },
  pick(id,val){
    const inp=document.getElementById(id);if(!inp)return;
    inp.value=val;
    const d=document.getElementById(id+"_drop");if(d)d.classList.remove("open");
    if(id==="pkProduct")PackingApp.autofillProduct(val);
    if(id==="poItemName")POApp.autofillPOItem(val);
    if(id==="dpParty")DispatchApp.onDispatchPartySelect();
    if(id==="poParty")POApp.onPOPartySelect();
  }
};

      };
      const fn=saveMap[state.activeTab];
      if(fn){try{fn();}catch(err){console.error(err);}}
      return;
    }
    const dropId=e.target && e.target.id ? e.target.id+"_drop" : null;
    const drop=dropId?document.getElementById(dropId):null;
    const dropOpen=drop&&drop.classList.contains("open");
    if(dropOpen&&e.key==="Enter"){
      const items=[...drop.querySelectorAll(".ac-item")];
      const idx=AC._hi[e.target.id];
      if(idx!=null&&idx>=0&&items[idx]){
        e.preventDefault();e.stopPropagation();
        items[idx].dispatchEvent(new MouseEvent("mousedown",{bubbles:true}));
        drop.classList.remove("open");
        return;
      }
      // dropdown open but nothing highlighted yet — close it, fall through to normal Enter-nav below
      drop.classList.remove("open");
    }
    if(e.key!=="Enter")return;
    if(tag==="TEXTAREA"||tag==="BUTTON")return;
    if(e.target.closest(".ac-drop"))return;
    e.preventDefault();
    const focusable=[...document.querySelectorAll('input:not([disabled]):not([readonly]):not([type="hidden"]), select:not([disabled]), textarea:not([disabled]), button:not([disabled])')].filter(el=>{const s=window.getComputedStyle(el);return s.display!=="none"&&s.visibility!=="hidden"&&el.offsetParent!==null;});
    const idx=focusable.indexOf(e.target);
    if(idx>-1&&idx<focusable.length-1)focusable[idx+1].focus();
  },true);
}

function printMtPO(po){
  const stats=getMtItemStats();
  const globalDispMap=buildMtDispMap();
  const dispMap={};
  state.mtDispatches.forEach(d=>{
    if(d.poId!=po.id)return;
    (d.items||[]).forEach(di=>{
      if(!dispMap[di.itemDesc])dispMap[di.itemDesc]={box:0,pcs:0};
      dispMap[di.itemDesc].box+=Number(di.qtyBox||0);
      dispMap[di.itemDesc].pcs+=Number(di.qtyPcs||0);
    });
  });
  const hasAnyPartial=(po.items||[]).some(it=>{const d=dispMap[it.itemDesc];return d&&(d.box>0||d.pcs>0);});
  const rows=(po.items||[]).map((it,i)=>{
    const mi=state.mtItems.find(m=>m.itemDesc===it.itemDesc);
    const s=mi?stats[mi.id]:null;
    const currentStock=s?Number(s.stockB||0):0;
    const d=dispMap[it.itemDesc]||{box:0,pcs:0};
    const cancB=Number(it.cancelledBox||0),cancP=Number(it.cancelledPcs||0);
    const pendBox=Math.max(0,Number(it.qtyBox||0)-d.box-cancB);
    const pendPcs=Math.max(0,Number(it.qtyPcs||0)-d.pcs-cancP);
    const needed=pendBox;
    // Find other PENDING (undispatched) MT POs needing this item with delivery date earlier than this PO
    // (tie-break by _ts if same delivery date) — that stock is "already committed" ahead of this PO
    let committed=0;
    if(po.deliveryDate){
      state.mtPos.forEach(op=>{
        if(op.id===po.id)return;
        if(op.status!=="active"||isMtPoDispatched(op.id,globalDispMap))return;
        const opd=op.deliveryDate||"";
        if(!opd)return;
        const isEarlier=opd<po.deliveryDate||(opd===po.deliveryDate&&(op._ts||0)<(po._ts||0));
        if(!isEarlier)return;
        (op.items||[]).forEach(oi=>{if(oi.itemDesc===it.itemDesc)committed+=Number(oi.qtyBox||0);});
      });
    }
    const available=Math.max(0,currentStock-committed);
    let statusHtml;
    if(needed<=0&&cancB>0&&d.box<Number(it.qtyBox||0))statusHtml=`<span style="color:#c62828;font-weight:700;text-decoration:line-through">❌ Cancelled</span>`;
    else if(needed<=0)statusHtml=`<span style="color:#2e7d32;font-weight:700">✅ Fully Dispatched</span>`;
    else if(available<=0)statusHtml=`<span style="color:#c62828;font-weight:700">❌ No Stock</span>`;
    else if(available>=needed)statusHtml=`<span style="color:#2e7d32;font-weight:700">✅ Ready</span>`;
    else statusHtml=`<span style="color:#e65100;font-weight:700">⚠️ ${needed-available} Box Short</span>`;
    const dispCell=hasAnyPartial?`<td style="color:${(d.box>0||d.pcs>0)?"#1565c0":"#999"};font-weight:${(d.box>0||d.pcs>0)?700:400}">${d.box} B / ${d.pcs} P</td>`:"";
    const pendStyle=hasAnyPartial&&(d.box>0||d.pcs>0)?`style="font-weight:800;color:#c62828"`:"";
    return`<tr><td>${i+1}</td><td>${esc(it.itemDesc)}</td><td>${esc(it.eanNo)||"—"}</td><td>${esc(it.pcsPerBox)||"—"}</td><td>${esc(it.qtyBox)}</td><td>${esc(it.qtyPcs)}</td>${dispCell}<td ${pendStyle}>${pendBox} B / ${pendPcs} P</td><td>${mi&&mi.offerPrice?"₹"+esc(mi.offerPrice):"—"}</td><td>${mi&&mi.mrp?"₹"+esc(mi.mrp):"—"}</td><td>${statusHtml}</td></tr>`;
  }).join("");
  const totBox=(po.items||[]).reduce((s,it)=>{const d=dispMap[it.itemDesc]||{box:0};return s+Math.max(0,Number(it.qtyBox||0)-d.box-Number(it.cancelledBox||0));},0);
  const totPcs=(po.items||[]).reduce((s,it)=>{const d=dispMap[it.itemDesc]||{pcs:0};return s+Math.max(0,Number(it.qtyPcs||0)-d.pcs-Number(it.cancelledPcs||0));},0);
  const dispHeader=hasAnyPartial?"<th>Already Dispatched</th>":"";
  const dispColspanExtra=hasAnyPartial?1:0;
  const w=window.open("","_blank","width=760,height=680");if(!w){alert("Popup blocked!");return;}
  w.document.write(`<!DOCTYPE html><html><head><title>MT PO ${esc(po.poNo)}</title><style>@media print{.np{display:none!important}body{margin:0}}body{font-family:Arial;padding:20px;background:#fff}h2{text-align:center;color:#1a237e;margin-bottom:4px}.sub{text-align:center;font-size:13px;color:#555;margin-bottom:16px}.info{display:grid;grid-template-columns:1fr 1fr;gap:4px 20px;border:1px solid #ddd;padding:12px;border-radius:6px;margin-bottom:14px}.info span{font-size:13px;padding:2px 0}.info b{display:inline-block;width:130px;color:#555}table{width:100%;border-collapse:collapse}th,td{border:1px solid #333;padding:8px 10px;font-size:13px;text-align:left}th{background:#1a237e;color:#fff}tr:nth-child(even){background:#f5f5f5}tfoot td{font-weight:700;background:#e3e3e3}.ft{margin-top:20px;font-size:12px;color:#666;text-align:center;border-top:1px dashed #ccc;padding-top:8px}.btn{margin:5px;padding:8px 20px;background:#1a237e;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:14px}</style></head><body><div class="np" style="text-align:center;margin-bottom:10px"><button class="btn" onclick="window.print()">🖨️ Print</button><button class="btn" style="background:#555" onclick="window.close()">✕ Close</button></div><h2>Jimit Pet LLP — Modern Trade Purchase Order</h2><div class="sub">MT PO${hasAnyPartial?" — (Partial Dispatch ho chuka hai, neeche Pending Qty print ho rahi hai)":""}</div><div class="info"><span><b>PO No:</b> ${esc(po.poNo)}</span><span><b>PO Date:</b> ${esc(fmtDate(po.poDate))}</span><span><b>DC:</b> ${esc(po.dc)}</span><span><b>Delivery Date:</b> ${esc(fmtDate(po.deliveryDate))}</span><span><b>Dispatch Date:</b> <span style="font-weight:800;color:#c62828;font-size:15px">${esc(fmtDate(po.dispatchDate))}</span></span></div>${po.manualFullDispatch?`<div style="border:2px solid #2e7d32;background:#e8f5e9;border-radius:6px;padding:10px 14px;margin-bottom:14px;font-size:13px"><b style="color:#2e7d32">☑️ Full Dispatch Marked</b>${po.fullDispatchAt?` function shellHtml(){
  const TABS=[{key:"home",label:"🏠 Home",perm:"home"},
    {key:"packing",label:"📦 Packing",perm:"packing"},{key:"pendingStock",label:"🗂 Pending Stock",perm:"pendingStock"},
    {key:"stockSummary",label:"📊 Stock Summary",perm:"stockSummary"},{key:"dispatch",label:"🚚 Dispatch",perm:"dispatch"},
    {key:"dispatchRegister",label:"📋 Dispatch Register",perm:"dispatchRegister"},{key:"gatePass",label:"🚪 Gate Pass",perm:"gatePass"},{key:"po",label:"📝 PO",perm:"po"},
    {key:"pendingOrder",label:"⏳ Pending Orders",perm:"pendingOrder"},{key:"orderVsAvailable",label:"📦 Order vs Available",perm:"orderVsAvailable"},{key:"mtPo",label:"🏪 MT PO",perm:"mtPo"},
    {key:"mtDispatch",label:"🏪 MT Dispatch",perm:"mtDispatch"},{key:"mtPending",label:"🏪 MT Pending",perm:"mtPending"},
    {key:"mtPacking",label:"🏭 MT Packing",perm:"mtPacking"},
    {key:"mtVehReq",label:"🚛 MT Vehc Req",perm:"mtVehReq"},
    {key:"planner",label:"🧮 Planner",perm:"planner"},
    {key:"mouldPlanner",label:"🏭 Moulding Planner",perm:"mouldPlanner"},
    {key:"mtPlanner",label:"🧮 MT Planner",perm:"mtPlanner"},
    {key:"mtSalesDashboard",label:"📊 MT Sales Dashboard",perm:"mtSalesDashboard"},
    {key:"store",label:"🏬 Store",perm:"store"},
    {key:"inventoryStock",label:"📦 Inventory Stock",perm:"inventoryStock"},{key:"canMake",label:"✅ Can Make Report",perm:"canMake"},{key:"accParty",label:"👥 Party Master",perm:"accounts"},{key:"accBills",label:"🧾 Bills (Sale / Purchase)",perm:"accounts"},{key:"accPay",label:"💵 Receipt / Payment",perm:"accounts"},{key:"accRates",label:"🏷️ Item Rates",perm:"accounts"},{key:"accOut",label:"📊 Accounts (Ledger / Ageing)",perm:"accounts"},{key:"invoice",label:"🧾 Invoice",perm:"invoice"},{key:"creditNote",label:"↩️ Credit Note",perm:"invoice"},{key:"debitNote",label:"📑 Debit Note",perm:"invoice"},{key:"productionReport",label:"📊 Production Report",perm:"productionReport"},{key:"minStock",label:"🛒 Min Stock & Purchase",perm:"minStock"},{key:"mtReport",label:"📈 MT Delivery Report",perm:"mtReport"},{key:"programStock",label:"✅ Program Stock Check",perm:"programStock"},
    ...(state.currentUser.role==="admin"?[{key:"userManagement",label:"👥 Users",perm:"userManagement"},{key:"recycleBin",label:"🗑️ Recycle Bin",perm:"userManagement"},{key:"yearEnd",label:"📅 Year End Process",perm:"userManagement"}]:[])
  ].filter(t=>t.perm==="accounts"?canAcc():can(t.perm));
  // ── TAB GROUPS (sirf navigation grouping; tabs ka kaam same hai) ──
  const TAB_GROUPS=[
    {k:"packingDept",label:"📦 PACKING DEPT",keys:["packing","pendingStock","stockSummary","planner","mouldPlanner"]},
    {k:"dispatchGrp",label:"🚚 DISPATCH",keys:["dispatch","dispatchRegister","gatePass","invoice","creditNote","debitNote"]},
    {k:"ordersGrp",label:"📝 ORDERS",keys:["po","pendingOrder","orderVsAvailable"]},
    {k:"mtGrp",label:"🏪 MT",keys:["mtPo","mtDispatch","mtPending","mtPacking","mtVehReq","mtPlanner","mtSalesDashboard","mtReport"]},
    {k:"storeGrp",label:"🏬 STORE/REPORTS",keys:["store","inventoryStock","canMake","productionReport","minStock","programStock"]},
    {k:"accGrp",label:"💰 ACCOUNTS",keys:["accParty","accBills","accPay","accRates","accOut"]},
    {k:"adminGrp",label:"🛠️ UTILITY",keys:["userManagement","recycleBin","yearEnd"]}
  ];
  window.__tabGroups={};
  const _grouped=new Set();
  const _tabBtn=t=>`<button class="tab-btn ${state.activeTab===t.key?"active":""}" onclick="App.switchTab('${t.key}')">${t.label}</button>`;
  let tabsBarHtml=TABS.filter(t=>t.key==="home").map(_tabBtn).join("");
  TAB_GROUPS.forEach(g=>{
    const items=g.keys.map(k=>TABS.find(t=>t.key===k)).filter(Boolean);
    if(!items.length)return;
    items.forEach(t=>_grouped.add(t.key));
    window.__tabGroups[g.k]=items.map(t=>({key:t.key,label:t.label}));
    const act=items.find(t=>t.key===state.activeTab);
    tabsBarHtml+=`<button class="tab-btn tab-grp ${act?"active":""}" onclick="App.toggleTabGroup('${g.k}',this)">${g.label}${act?` <span style="font-weight:400;font-size:11px">· ${act.label.replace(/^\S+\s*/,"")}</span>`:""} ▾</button>`;
  });
  // koi tab kisi group me nahi hai to wo seedha bar me dikhega (kuchh miss nahi hoga)
  tabsBarHtml+=TABS.filter(t=>t.key!=="home"&&!_grouped.has(t.key)).map(_tabBtn).join("");
  return`<div style="min-height:100vh;background:#f0f4f8">
  <div class="topbar">
    <div class="topbar-row">
      <div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px;font-weight:800">🏭 Jimit Pet LLP</span>
        <span style="font-size:11px;background:rgba(0,200,0,.2);padding:2px 8px;border-radius:20px;">💾 Offline</span><input id="globalSearchInput" class="inp" placeholder="🔍 PO / Carton / Challan search" style="width:210px;margin:0;padding:5px 12px;font-size:12px;border-radius:20px" onkeydown="if(event.key==='Enter'){App.globalSearch(this.value)}"><button class="btn btn-sm" style="background:rgba(255,255,255,.2)" onclick="App.globalSearch(document.getElementById('globalSearchInput').value)">Search</button><span id="liveClock" style="font-size:12px;font-weight:700;background:rgba(255,255,255,.15);padding:3px 10px;border-radius:20px;white-space:nowrap"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        ${state.currentUser.role==="admin"
          ?`<input type="file" id="restoreFileInput" style="display:none" onchange="App.restoreBackup(event)"><button id="userMenuBtn" class="btn" style="background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);padding:5px 12px;font-size:13px" onclick="App.toggleUserMenu(this)" title="Backup, Import, Restore, FY, Clear All">👤 ${esc(state.currentUser.name)} ▾</button>`
          :`<button class="btn" style="background:rgba(46,125,50,.85);border:1px solid rgba(255,255,255,.4);padding:4px 10px;font-size:11px" onclick="App.downloadBackup()" title="Poora data ek .json backup file mein save karo">⬇️ Backup</button>${fyBadgeHtml()}<span style="font-size:13px">👤 ${esc(state.currentUser.name)}</span>`}
        <button class="btn" style="background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);padding:5px 14px" onclick="App.logout()">Logout</button>
      </div>
    </div>
    <div class="tabs-row" onscroll="App.closeTabMenu()">${tabsBarHtml}</div>
  </div>
  ${renderMtAlertBanner()}
  <div class="content" id="tabContent"></div></div>`;
}

function renderTabContent(){
  const el=document.getElementById("tabContent");if(!el)return;
  const fns={packing:renderPackingTab,pendingStock:renderPendingStockTab,stockSummary:renderStockSummaryTab,
    dispatch:renderDispatchTab,dispatchRegister:renderDispatchRegisterTab,gatePass:renderGatePassTab,po:renderPOTab,
    pendingOrder:renderPendingOrderTab,orderVsAvailable:renderOrderVsAvailableTab,mtPo:renderMTPoTab,mtDispatch:renderMTDispatchTab,
    mtPending:renderMTPendingTab,mtPacking:renderMTPackingTab,mtVehReq:renderMtVehReqTab,planner:renderPlannerTab,mouldPlanner:renderMouldPlannerTab,store:renderStoreTab,inventoryStock:renderInventoryStockTab,canMake:renderCanMakeTab,yearEnd:renderYearEndTab,accParty:renderAccPartyTab,accBills:renderAccBillsTab,accPay:renderAccPayTab,accOut:renderAccOutTab,accRates:renderAccRatesTab,invoice:renderInvoiceTab,creditNote:renderCreditNoteTab,debitNote:renderDebitNoteTab,productionReport:renderProductionReportTab,home:renderHomeTab,minStock:renderMinStockTab,mtReport:renderMtReportTab,programStock:renderProgramStockTabV2,mtPlanner:renderMtPlannerTab,mtSalesDashboard:renderMtSalesDashboardTab,userManagement:renderUserManagementTab,recycleBin:renderRecycleBinTab};
  el.innerHTML=(fns[state.activeTab]||(() =>""))();
  const mr=document.getElementById("modalRoot");if(mr)mr.innerHTML=renderItemMasterModal()+renderMtItemModal();
  setTimeout(registerAC,0);
  if(state.activeTab==="mtSalesDashboard")setTimeout(renderMtSalesCharts,50);
}

function softRefreshCurrentTab(){
  try{
    const t=state.activeTab;
    if(t==="packing"){const b=document.getElementById("packingHistoryBody");const rows=getPackingHistoryFilteredRows();if(b)b.innerHTML=packingHistoryRows(rows);const tf=b?b.parentElement.querySelector("tfoot"):null;if(tf)tf.outerHTML=packingHistoryTotalFooter(rows);}
    else if(t==="pendingStock"){if(document.getElementById("psTable"))PendingStockApp.filterPendingStock();}
    else if(t==="stockSummary"){if(document.getElementById("ssTable"))StockSummaryApp.filterStockSummary();}
    else if(t==="dispatchRegister"){if(document.getElementById("drTable"))DispatchRegisterApp.filterDispatchRegister();}
    else if(t==="po"){const b=document.getElementById("poHistoryBody");if(b)b.innerHTML=poHistoryRows();}
    else if(t==="pendingOrder"){if(document.getElementById("poFTable"))PendingOrderApp.filterPendingOrders();}
    else if(t==="mtPo"){const b=document.getElementById("mtPoListBody");if(b)b.innerHTML=mtPoListRows();}
    else if(t==="mtDispatch"){const b=document.getElementById("mtDispatchBody");if(b)b.innerHTML=mtDispatchRegisterRows();}
    else if(t==="mtPending"){if(document.getElementById("mtpTable"))MTPendingApp.filterMtPending();}
    else if(t==="mtPacking"){const b=document.getElementById("mtPackingHistoryBody");if(b)b.innerHTML=mtPackingHistoryRows();}
    else if(t==="userManagement"){const b=document.getElementById("userListBody");if(b)b.innerHTML=userListRows();}
  }catch(e){}
}

function renderItemMasterModal(){
  if(!temp.itemMasterOpen)return"";

  searchCarton(){

// Returns {list, map} of PO Nos filtered by party (empty party = all pending POs)
function dispatchPoOptionsFor(partyFilter,forcePoNo){
  const rows=getPendingOrderRows();
  const pf=(partyFilter||"").trim().toLowerCase();
  const filtered=pf?rows.filter(r=>r.party.toLowerCase()===pf):rows;
  const map={};filtered.forEach(r=>{if(!map[r.poNo])map[r.poNo]=r.party;});
  let list=Object.keys(map);
  if(forcePoNo&&!list.includes(forcePoNo)){const row=rows.find(r=>r.poNo===forcePoNo);list.push(forcePoNo);map[forcePoNo]=row?row.party:partyFilter;}
  return{list,map};
}
function getAvailableCartonsForProduct(productName,batchFilter){
  const dispMap=buildDispMap();const nb=batchFilter?String(batchFilter).trim().toLowerCase():null;
  return state.packings.filter(p=>p.productName===productName&&(!nb||String(p.batchNo||"").trim().toLowerCase()===nb)).map(p=>{
    const k=`${p.cartonNo}-${p.productName}`;const disp=dispMap[k]||0;const remaining=p.totalQty-disp;
    return{cartonNo:p.cartonNo,remaining,qtyType:p.qtyType,batchNo:p.batchNo};
  }).filter(c=>c.remaining>0);
}

function getQtyPerCartonFor(productName,cartonNo){
  let pk=state.packings.find(p=>p.productName===productName&&p.cartonNo===cartonNo);
  if(pk&&pk.qtyPerCarton)return Number(pk.qtyPerCarton);
  const im=state.itemMaster.find(i=>i.name===productName);
  if(im&&im.qtyPerCarton)return Number(im.qtyPerCarton);
  pk=state.packings.find(p=>p.productName===productName&&p.qtyPerCarton);
  if(pk)return Number(pk.qtyPerCarton);
  return 0;
}
function buildGeneralDispIndex(){
  const idx={};
  state.dispatches.forEach(d=>{
    (d.items||[]).forEach(di=>{
      const linkedPoNo=di.poNo!=null?di.poNo:d.poNo;
      const key=linkedPoNo+"||"+di.productName;
      if(!idx[key])idx[key]=[];
      idx[key].push({qty:Number(di.qty)||0,qtyType:di.qtyType||"Pcs",cartonNo:di.cartonNo});
    });
  });
  return idx;
}
function getPendingOrderRows(){
  const rows=[];
  const dispIdx=buildGeneralDispIndex();
  state.purchaseOrders.forEach(po=>{
    if(po.status==="cancelled")return;
    // Same product kai baar alag-alag line item ke roop me PO mein ho sakta hai —
    // unhe group karke SAATH mein total order maano, taaki dispatch double-count na ho
    const groups={};
    const order=[];
    (po.items||[]).filter(i=>!i.cancelled).forEach(item=>{
      const key=item.productName+"||"+item.unit;
      if(!groups[key]){groups[key]={productName:item.productName,unit:item.unit,orderedQty:0,itemIds:[]};order.push(key);}
      groups[key].orderedQty+=Number(item.qty)||0;
      groups[key].itemIds.push(item.id);
    });
    order.forEach(key=>{
      const g=groups[key];
      const poUnit=g.unit;
      let dispTotal=0;
      const matches=dispIdx[po.poNo+"||"+g.productName]||[];
      matches.forEach(di=>{
        let q=di.qty;
        if(di.qtyType!==poUnit){
          const qpc=getQtyPerCartonFor(g.productName,di.cartonNo);
          if(poUnit==="Cts"&&qpc>0){q=q/qpc;} // Pcs/Set/Box → Cartons
          else if(di.qtyType==="Cts"&&qpc>0&&poUnit!=="Cts"){q=q*qpc;} // Cartons → Pcs/Set/Box
        }
        dispTotal+=q;
      });
      const pend=g.orderedQty-dispTotal;
      rows.push({poId:po.id,poNo:po.poNo,party:po.partyName,transport:po.transport,date:po.date,productName:g.productName,orderedQty:g.orderedQty,unit:poUnit,dispatchedQty:Math.round(dispTotal*100)/100,pendingQty:Math.round(pend*100)/100,itemId:g.itemIds[0],itemIds:g.itemIds,status:po.status});
    });
  });
  return rows.filter(r=>r.pendingQty>0&&r.status!=="cancelled");
}
function buildProductCategoryMap(){
  const norm=s=>String(s||"").trim().toLowerCase();const catMap={};
  state.packings.forEach(p=>{if(p.category)catMap[norm(p.productName)]=p.category;}); // purani Packing entries — fallback
  state.itemMaster.forEach(i=>{if(i.category)catMap[norm(i.name)]=i.category;}); // Item Master hamesha authoritative/latest hai — isko override karne do
  return catMap;
}
function getAvailableStockMap(batchFilter){
  const dispMap=buildDispMap();const avail={};const nb=batchFilter?String(batchFilter).trim().toLowerCase():null;
  state.packings.forEach(p=>{
    if(nb && String(p.batchNo||"").trim().toLowerCase()!==nb)return;
    const dk=`${p.cartonNo}-${p.productName}`;const disp=dispMap[dk]||0;const pq=p.totalQty-disp;if(pq>0){const key=p.productName;if(!avail[key])avail[key]={availQty:0,availCartons:0,qtyPerCarton:p.qtyPerCarton};avail[key].availQty+=pq;avail[key].availCartons+=p.qtyPerCarton?Math.ceil(pq/p.qtyPerCarton):Number(p.cartons||0);}
  });
  return avail;
}

function colorForString(str){
  let hash=0;const s=String(str||"");
  for(let i=0;i<s.length;i++){hash=s.charCodeAt(i)+((hash<<5)-hash);}
  const hue=Math.abs(hash)%360;
  return{bg:`hsl(${hue},70%,92%)`,fg:`hsl(${hue},70%,28%)`};
}
function productHasBatch(productName,batch){
  const nb=String(batch||"").trim().toLowerCase();if(!nb)return true;
  const pn=String(productName||"").trim().toLowerCase();
  // 1) Exact match: product has an actual packing record tagged with this batch
  const packed=state.packings.some(p=>p.productName===productName&&String(p.batchNo||"").trim().toLowerCase()===nb);
  if(packed)return true;
  // 2) Fallback for products never packed yet: product name itself starts with the batch/brand name
  //    (e.g. "GLASS LOOK JAR 500" belongs to batch "GLASS LOOK") — covers pending orders with zero stock so far.
  return pn.startsWith(nb);
}

function pendingOrderRowsHtml(rows){const availMap=getAvailableStockMap();return rows.map(r=>{const pc=colorForString(r.party);const av=availMap[r.productName];const hasStock=av&&(av.availQty>0||av.availCartons>0);const rowStyle=hasStock?`background:#e8f5e9`:``;const stockBadge=hasStock?`<span title="Stock available: ${esc(av.availQty)} (${esc(av.availCartons)} Ctn)" style="margin-left:6px;font-size:11px;color:#2e7d32;font-weight:700">✅ In Stock</span>`:``;return`<tr style="${rowStyle}"><td>${esc(r.poNo)}</td><td><span style="background:${pc.bg};color:${pc.fg};font-weight:700;padding:3px 10px;border-radius:12px;font-size:12px;display:inline-block">${esc(r.party)}</span></td><td>${esc(r.transport)}</td><td>${esc(fmtDate(r.date))}</td><td>${esc(r.productName)}${stockBadge}</td><td>${esc(r.orderedQty)} ${esc(r.unit)}</td><td>${esc(r.dispatchedQty)}</td><td style="font-weight:700;color:#e65100">${esc(r.pendingQty)}</td><td><button class="btn btn-sm" style="background:#283593;color:#fff" onclick="App.printPendingPO('${esc(r.poNo)}')" title="Sirf is PO ke pending items print karo">🖨️ PO</button> ${!isRO()?`<button class="btn btn-sm btn-danger" onclick='App.cancelPendingQty(${r.poId},${JSON.stringify(r.itemIds||[r.itemId])},${r.pendingQty})'>Cancel Qty</button>`:"—"}</td></tr>`;}).join("")||`<tr><td colspan="9" style="text-align:center;color:#999;padding:24px">No pending orders</td></tr>`;}
function itemWiseSummaryHtml(rows,opts={}){
  const{category,batch,diffFilter}=opts;const norm=s=>String(s||"").trim().toLowerCase();const catMap=buildProductCategoryMap();
  const itemSum={};rows.filter(r=>r.unit==="Cts").forEach(r=>{if(category&&norm(catMap[norm(r.productName)])!==norm(category))return;if(batch&&!productHasBatch(r.productName,batch))return;if(!itemSum[r.productName])itemSum[r.productName]={product:r.productName,pendingQty:0};itemSum[r.productName].pendingQty+=r.pendingQty;});
  const availMap=getAvailableStockMap(batch||null);let vals=Object.values(itemSum);
  vals=vals.map(r=>{const av=availMap[r.product]||{availQty:0,availCartons:0};return{...r,diff:r.pendingQty-av.availCartons};});
  if(diffFilter==="short")vals=vals.filter(r=>r.diff>0);
  else if(diffFilter==="surplus")vals=vals.filter(r=>r.diff<0);
  if(opts.sortAZ)vals=[...vals].sort((a,b)=>String(a.product||"").localeCompare(String(b.product||"")));
  if(!vals.length)return`<div style="color:#999;text-align:center;padding:16px">No pending Cts orders${category?` for category "${esc(category)}"`:""}${batch?` / batch "${esc(batch)}"`:""}${diffFilter==="short"?" (koi shortfall nahi)":diffFilter==="surplus"?" (koi surplus nahi)":""}</div>`;
  let totPend=0,totAvail=0,totCtn=0;
  const bodyRows=vals.map(r=>{const av=availMap[r.product]||{availQty:0,availCartons:0};const diff=r.diff;totPend+=r.pendingQty;totAvail+=av.availQty;totCtn+=av.availCartons;return`<tr><td><b>${esc(r.product)}</b></td><td style="font-weight:700;color:#e65100">${esc(r.pendingQty)}</td><td style="font-weight:700;color:#2e7d32">${esc(av.availQty)}</td><td style="font-weight:700;color:#1565c0">${esc(av.availCartons)} Ctn</td><td style="font-weight:700;color:${diff>0?"#c62828":diff<0?"#1565c0":"#555"}">${diff>0?"⚠️ Short: "+diff:diff<0?"✅ Extra: "+Math.abs(diff):"✅ Exact"}</td></tr>`;}).join("");
  const totDiff=totPend-totCtn;
  return`<div style="overflow-x:auto"><table class="tbl" id="ovaTable"><thead><tr style="background:#37474f;color:#fff"><th>Product</th><th style="color:#ffcc80">Pending Order (Cts)</th><th style="color:#a5d6a7">Available Stock (Cts)</th><th style="color:#90caf9">Available Cartons</th><th>Shortfall / Surplus</th></tr></thead><tbody>${bodyRows}</tbody><tfoot><tr style="background:#e8eaf6;font-weight:800"><td>TOTAL</td><td style="color:#e65100">${totPend}</td><td style="color:#2e7d32">${totAvail}</td><td style="color:#1565c0">${totCtn} Ctn</td><td style="color:${totDiff>0?"#c62828":totDiff<0?"#1565c0":"#555"}">${totDiff>0?"⚠️ Short: "+totDiff:totDiff<0?"✅ Extra: "+Math.abs(totDiff):"✅ Exact"}</td></tr></tfoot></table></div>`;
}

  filterPendingOrders(){const fp=document.getElementById("poFParty").value,fpr=document.getElementById("poFProd").value,fc=document.getElementById("poFCat").value,fb=document.getElementById("poFBatch")?.value||"",ft=document.getElementById("poFTrp").value;const norm=s=>String(s||"").trim().toLowerCase();const catMap=buildProductCategoryMap();let rows=getPendingOrderRows().filter(r=>{if(fp&&r.party!==fp)return false;if(fpr&&r.productName!==fpr)return false;if(ft&&r.transport!==ft)return false;if(fc&&norm(catMap[norm(r.productName)])!==norm(fc))return false;if(fb&&!productHasBatch(r.productName,fb))return false;return true;});if(temp.poOnlyStock){const availMap=getAvailableStockMap();rows=rows.filter(r=>{const av=availMap[r.productName];return av&&(av.availQty>0||av.availCartons>0);});}if(temp.poSortPartyAZ)rows=[...rows].sort((a,b)=>String(a.party||"").localeCompare(String(b.party||"")));document.querySelector("#poFTable tbody").innerHTML=pendingOrderRowsHtml(rows);},

    if(!cq||cq<=0||cq>maxQty){alert("Invalid");return;}

      if(po.id!==poId)return po;

        const take=Math.min(remaining,Number(i.qty)||0);

        return{...i,qty:Math.max(0,(Number(i.qty)||0)-take),pendingQty:Math.max(0,(i.pendingQty||i.qty)-take)};
      })};
    });

      <button class="btn btn-secondary" style="margin-top:8px" onclick="App.downloadImportTemplate()">📄 Template Excel Download Karo</button>
    </div>
    <div style="margin-top:14px"><label class="lbl">Excel File Choose Karo (.xlsx / .xls / .csv)</label><input class="inp" type="file" id="importFileInput" accept=".xlsx,.xls,.csv" onchange="App.onImportFileChange(event)"></div>
    ${previewHtml}

    `:""}
  </div></div></div>`;
}
const ImportApp={
  openImportModal(){temp.importModalOpen=true;temp.importTarget="";temp.importParsedRows=null;_refreshModal();},
  closeImportModal(){temp.importModalOpen=false;temp.importTarget="";temp.importParsedRows=null;_refreshModal();renderTabContent();},
  onImportTargetChange(){temp.importTarget=document.getElementById("importTargetSel").value;temp.importParsedRows=null;_refreshModal();},
  downloadImportTemplate(){
    const cfg=IMPORT_TARGETS[temp.importTarget];if(!cfg)return;
    const ws=XLSX.utils.aoa_to_sheet([cfg.columns]);
    const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Template");
    XLSX.writeFile(wb,`${cfg.label.replace(/[^a-z0-9]+/gi,"_")}_Template.xlsx`);
  },
  onImportFileChange(evt){
    const file=evt.target.files&&evt.target.files[0];if(!file)return;
    const cfg=IMPORT_TARGETS[temp.importTarget];if(!cfg)return;
    if(typeof XLSX==="undefined"){alert("Excel reader load nahi hua — internet check karo");return;}
    const reader=new FileReader();
    reader.onload=e=>{
      try{
        const wb=XLSX.read(e.target.result,{type:"array"});
        const ws=wb.Sheets[wb.SheetNames[0]];
        const json=XLSX.utils.sheet_to_json(ws,{defval:""});
        const valid=json.filter(r=>cfg.isValid(r));
        if(!valid.length){alert("⚠️ Koi valid row nahi mili. Column headers exact match karo template se.");temp.importParsedRows=null;_refreshModal();return;}
        temp.importParsedRows=valid;
        _refreshModal();
      }catch(err){alert("File read nahi ho payi: "+(err.message||"invalid file"));}
    };
    reader.readAsArrayBuffer(file);
  },
  doImport(){
    const cfg=IMPORT_TARGETS[temp.importTarget];const rows=temp.importParsedRows;
    if(!cfg||!rows||!rows.length)return;
    if(!confirm(`${rows.length} rows import karni hain '${cfg.label}' mein. Confirm karo?`))return;
    let count=0;
    if(cfg.grouped){
      const groups={};
      rows.forEach(r=>{const key=String(r[cfg.groupKey]||"").trim();if(!key)return;if(!groups[key])groups[key]=[];groups[key].push(r);});
      Object.entries(groups).forEach(([key,grpRows])=>{state[cfg.stateKey].push(cfg.rowsToEntry(key,grpRows));count++;});
    }else{
      rows.forEach(r=>{state[cfg.stateKey].push(cfg.rowToEntry(r));count++;});
    }
    persist(cfg.dbKey,state[cfg.stateKey]);
    alert(`✅ ${count} entries '${cfg.label}' mein import ho gayi!`);
    temp.importParsedRows=null;
    document.getElementById("importFileInput")&&(document.getElementById("importFileInput").value="");
    _refreshModal();
    renderTabContent();
  }
};

function getAccessoryUnit(name){

function plannerResultHtml(){
  const res=temp.plannerResult;
  if(!res)return"";

  const rows=Object.entries(res.accTotals).map(([name,qty])=>{
    const unit=getAccessoryUnit(name);
    const need=Math.ceil(qty*100)/100;
    const pct=Number(res.wastage[name]||0);

    const stock=getStoreStock(name);

    return`<tr><td><b>${esc(name)}</b> <span class="badge" style="background:#e0e0e0;color:#555">${esc(unit)}</span></td><td style="font-weight:700;color:#1565c0">${need} ${esc(unit)}</td><td><input class="inp" type="number" step="0.1" min="0" value="${pct}" style="width:80px;margin-bottom:0" onchange="App.updateWastagePct('${esc(name)}',this.value)"> %</td><td style="font-weight:800;color:#6a1b9a">${final} ${esc(unit)}</td><td><input class="inp" type="number" step="1" min="0" value="${pbq||""}" placeholder="e.g. 100" style="width:90px;margin-bottom:0" onchange="App.updatePerBoxQty('${esc(name)}',this.value)"></td><td style="font-weight:800;color:#00838f">${boxQty!=null?boxQty+" Box":"—"}</td><td>${stock} ${esc(unit)}</td><td>${ok?`<span style="color:#2e7d32;font-weight:700">✅ Available</span>`:`<span style="color:#c62828;font-weight:700">⚠️ Short by ${Math.round((final-stock)*100)/100} ${esc(unit)}</span>`}</td></tr>`;

function inventoryStockRows(){
  const search=(temp.invSearch||"").trim().toLowerCase();
  const batchFilter=temp.invBatchFilter||"";
  const categoryFilter=temp.invCategoryFilter||"";
  const productFilter=temp.invProductFilter||"";
  const locationFilter=temp.invLocationFilter||"";
  const supplierFilter=temp.invSupplierFilter||"";
  const statusFilter=temp.invStatusFilter||"";
  const batchSet=getItemsForBatch(batchFilter);
  const productSet=getItemsForProduct(productFilter);
  let names=getAllStoreItemNames();
  if(search)names=names.filter(n=>n.toLowerCase().includes(search));
  if(batchSet)names=names.filter(n=>batchSet.has(n));
  if(productSet)names=names.filter(n=>productSet.has(n));
  if(categoryFilter)names=names.filter(n=>getItemCategory(n)===categoryFilter);
  if(locationFilter)names=names.filter(n=>getItemLocation(n)===locationFilter);
  if(supplierFilter)names=names.filter(n=>getItemSupplier(n)===supplierFilter);
  let rows=names.map(n=>({name:n,batches:getItemBatches(n),category:getItemCategory(n),location:getItemLocation(n),supplier:getItemSupplier(n),stock:getStoreStock(n)}));
  if(statusFilter){
    rows=rows.filter(r=>{
      if(statusFilter==="out")return r.stock<=0;
      if(statusFilter==="low")return r.stock>0&&r.stock<getMinStock(r.name);
      if(statusFilter==="good")return r.stock>=getMinStock(r.name);
      return true;
    });
  }
  if(temp.invSortAZ)rows=[...rows].sort((a,b)=>a.name.localeCompare(b.name));
  return rows;
}

  saveManualStockAdjust(){
    const itemName=document.getElementById("manualAdjItem").value.trim();

    const type=document.querySelector('input[name="manualAdjType"]:checked')?.value;

const StoreApp={
  setGrnMode(m){temp.grnMode=m;temp.grnItems=[];renderTabContent();},

  addGrnItem(){const name=document.getElementById("grnItemName").value.trim();const qty=Number(document.getElementById("grnItemQty").value);const location=document.getElementById("grnItemLocation").value.trim();if(!name){alert("Item Name required");return;}if(!qty||qty<=0){alert("Sahi Qty daalo");return;}if(!temp.grnItems)temp.grnItems=[];temp.grnItems.push({name,qty,location});document.getElementById("grnItemName").value="";document.getElementById("grnItemQty").value="";document.getElementById("grnItemLocation").value="";renderTabContent();setTimeout(()=>document.getElementById("grnItemName")?.focus(),0);},

  saveGrn(){
    const mode=temp.grnMode||"purchase";
    if(!temp.grnItems||!temp.grnItems.length){alert("Kam se kam ek item add karo");return;}
    const date=document.getElementById("grnDate").value||todayStr();
    const remark=document.getElementById("grnRemark").value;

    }else{
      entry={id:uid(),kind:mode,grnNo:mode==="purchase"?genGrnNo():genReturnNo(),date,remark,items:temp.grnItems,savedAt:nowStr(),savedBy:state.currentUser.name,_ts:Date.now()};

function getMtShortfallList(){
  const agg={};
  getMtPendingRows().forEach(r=>{
    if(!agg[r.itemDesc])agg[r.itemDesc]=0;

function mtPlannerResultHtml(){
  const res=temp.mtPlannerResult;
  if(!res)return"";
  if(!res.wastage)res.wastage={};
  if(!res.perBoxQty)res.perBoxQty={};
  const rows=Object.entries(res.accTotals).map(([name,qty])=>{
    const need=Math.ceil(qty*100)/100;
    const pct=Number(res.wastage[name]||0);
    const final=Math.ceil(need*(1+pct/100));
    const pbq=Number(res.perBoxQty[name]||0);
    const boxQty=pbq>0?Math.ceil(final/pbq):null;
    const stock=getStoreStock(name);
    const ok=stock>=final;
    return`<tr><td><b>${esc(name)}</b></td><td style="font-weight:700;color:#1565c0">${need}</td><td><input class="inp" type="number" step="0.1" min="0" value="${pct}" style="width:80px;margin-bottom:0" onchange="App.updateMtWastagePct('${esc(name)}',this.value)"> %</td><td style="font-weight:800;color:#6a1b9a">${final}</td><td><input class="inp" type="number" step="1" min="0" value="${pbq||""}" placeholder="e.g. 100" style="width:90px;margin-bottom:0" onchange="App.updateMtPerBoxQty('${esc(name)}',this.value)"></td><td style="font-weight:800;color:#00838f">${boxQty!=null?boxQty+" Box":"—"}</td><td>${stock}</td><td>${ok?`<span style="color:#2e7d32;font-weight:700">✅ Available</span>`:`<span style="color:#c62828;font-weight:700">⚠️ Short by ${Math.round((final-stock)*100)/100}</span>`}</td></tr>`;
  }).join("");
  const missingHtml=res.missing.length?`<div style="background:#ffebee;border:1px solid #ef9a9a;border-radius:8px;padding:10px 14px;font-size:12px;color:#c62828;margin-top:12px">⚠️ In items ka MT BOM set nahi hai, inki calculation shamil nahi hui: ${res.missing.map(esc).join(", ")}</div>`:"";
  return`<div style="margin-top:20px"><b style="font-size:14px;color:#1a237e">📦 Total Accessories Required (Store Stock ke saath)</b><div style="font-size:11px;color:#888;margin-top:4px">💡 Kharab hone wali accessories ke liye 'Extra %' daalo. 'Per Box Qty' bharo to 'Box Qty' khud calculate ho jaayegi (Final Qty ÷ Per Box Qty)</div><table class="tbl" style="margin-top:8px"><thead><tr style="background:#37474f;color:#fff"><th>Accessory</th><th>Required Qty</th><th>Extra %</th><th>Final Qty</th><th>Per Box Qty</th><th>Box Qty</th><th>Current Store Stock</th><th>Status</th></tr></thead><tbody>${rows||`<tr><td colspan="8" style="text-align:center;color:#999;padding:12px">Koi accessory calculate nahi hui</td></tr>`}</tbody></table>${missingHtml}</div>`;
}
const MtPlannerApp={
  loadMtPlannerFromPo(){
    const poId=document.getElementById("mtPlannerPoSelect").value;

function getMtItemValue(itemDesc,qtyPcs){
  const mi=state.mtItems.find(m=>m.itemDesc===itemDesc);
  if(!mi)return 0;
  const basicPrice=Number(mi.basicPrice||0),gstRate=Number(mi.gstRate||0);
  if(!basicPrice)return 0;
  return Math.round(Number(qtyPcs||0)*basicPrice*(1+gstRate/100)*100)/100;
}
function getMtSalesData(dateFrom,dateTo,dcFilter){
  const itemSale={},itemQty={},divisionSale={},monthlySale={},dcSale={};
  const dcItemBreakdown={}; // key: dc||itemDesc -> {dc,item,qtyBox,qtyPcs,basicPrice,gstRate,value}
  state.mtDispatches.forEach(d=>{
    if(dateFrom&&d.date<dateFrom)return;
    if(dateTo&&d.date>dateTo)return;
    if(dcFilter&&d.dc!==dcFilter)return;
    const month=String(d.date||"").slice(0,7)||"Unknown"; // YYYY-MM
    (d.items||[]).forEach(it=>{
      const val=getMtItemValue(it.itemDesc,it.qtyPcs);
      const mi=state.mtItems.find(m=>m.itemDesc===it.itemDesc);
      const div=mi&&mi.division?mi.division:"Unassigned";
      const dc=d.dc||"Unknown";
      itemSale[it.itemDesc]=(itemSale[it.itemDesc]||0)+val;
      itemQty[it.itemDesc]=(itemQty[it.itemDesc]||0)+Number(it.qtyPcs||0);
      divisionSale[div]=(divisionSale[div]||0)+val;
      monthlySale[month]=(monthlySale[month]||0)+val;
      dcSale[dc]=(dcSale[dc]||0)+val;
      const key=dc+"||"+it.itemDesc;
      if(!dcItemBreakdown[key])dcItemBreakdown[key]={dc,item:it.itemDesc,qtyBox:0,qtyPcs:0,basicPrice:mi?Number(mi.basicPrice||0):0,gstRate:mi?Number(mi.gstRate||0):0,value:0};
      dcItemBreakdown[key].qtyBox+=Number(it.qtyBox||0);
      dcItemBreakdown[key].qtyPcs+=Number(it.qtyPcs||0);
      dcItemBreakdown[key].value+=val;
    });
  });
  return{itemSale,itemQty,divisionSale,monthlySale,dcSale,dcItemBreakdown:Object.values(dcItemBreakdown)};
}

let _mtCharts={};
function renderMtSalesCharts(){
  if(typeof Chart==="undefined")return;
  Object.values(_mtCharts).forEach(c=>{try{c.destroy();}catch(e){}});
  _mtCharts={};
  const data=getMtSalesData(temp.mtSalesFrom||"",temp.mtSalesTo||"",temp.mtSalesDC||"");
  const colors=["#1a237e","#c62828","#2e7d32","#e65100","#6a1b9a","#00838f","#f9a825","#5e35b1","#00695c","#ad1457","#4527a0","#37474f"];
  const mk=(id,type,labels,values,label,opts)=>{
    const el=document.getElementById(id);if(!el)return;
    _mtCharts[id]=new Chart(el.getContext("2d"),{type,data:{labels,datasets:[{label,data:values,backgroundColor:labels.map((_,i)=>colors[i%colors.length]),borderRadius:type==="bar"?4:0}]},options:Object.assign({responsive:true,plugins:{legend:{display:type==="pie"||type==="doughnut"}}},opts||{})});
  };
  // Item-wise Sale (top 15 by value)
  const itemSaleSorted=Object.entries(data.itemSale).sort((a,b)=>b[1]-a[1]).slice(0,15);
  mk("chartItemSale","bar",itemSaleSorted.map(x=>x[0]),itemSaleSorted.map(x=>Math.round(x[1])),"Sale ₹");
  // Item-wise Qty (top 15 by qty)
  const itemQtySorted=Object.entries(data.itemQty).sort((a,b)=>b[1]-a[1]).slice(0,15);
  mk("chartItemQty","bar",itemQtySorted.map(x=>x[0]),itemQtySorted.map(x=>Math.round(x[1])),"Qty (Pcs)");
  // Division-wise Sale (pie)
  const divSorted=Object.entries(data.divisionSale).sort((a,b)=>b[1]-a[1]);
  mk("chartDivisionSale","pie",divSorted.map(x=>x[0]),divSorted.map(x=>Math.round(x[1])),"Sale ₹");
  // Monthly Sale (line, sorted chronologically)
  const monthSorted=Object.entries(data.monthlySale).sort((a,b)=>a[0]<b[0]?-1:1);
  mk("chartMonthlySale","line",monthSorted.map(x=>x[0]),monthSorted.map(x=>Math.round(x[1])),"Sale ₹",{elements:{line:{borderColor:"#1a237e",tension:.3},point:{backgroundColor:"#1a237e"}}});
  // DC-wise Sale (top 15)
  const dcSorted=Object.entries(data.dcSale).sort((a,b)=>b[1]-a[1]).slice(0,15);
  mk("chartDcSale","bar",dcSorted.map(x=>x[0]),dcSorted.map(x=>Math.round(x[1])),"Sale ₹");
}

async function extractMtPoPdfItems(dataUrl){
  if(!dataUrl||!dataUrl.startsWith("data:application/pdf")||!window.pdfjsLib)throw new Error("PDF reader load nahi hua ya file PDF nahi hai (photo/scan nahi chalegi)");
  const base64=dataUrl.split(",")[1];
  const bin=atob(base64);
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  const pdf=await pdfjsLib.getDocument({data:bytes}).promise;
  const out=[];
  const pages=Math.min(pdf.numPages,6);
  for(let p=1;p<=pages;p++){
    const page=await pdf.getPage(p);
    const tc=await page.getTextContent();
    tc.items.forEach(it=>{if(it.str&&it.str.trim())out.push({s:it.str.trim(),x:it.transform[4],y:it.transform[5]-(p-1)*5000,w:it.width||0});});
  }
  return out;
}
function mtpoGroupLines(items){
  const sorted=[...items].sort((a,b)=>b.y-a.y||a.x-b.x);
  const lines=[];
  for(const it of sorted){
    const L=lines[lines.length-1];
    if(L&&Math.abs(L.y-it.y)<=2.6)L.items.push(it);else lines.push({y:it.y,items:[it]});
  }
  lines.forEach(l=>{l.items.sort((a,b)=>a.x-b.x);l.text=l.items.map(i=>i.s).join(" ");});
  return lines;
}

    const m=first[0].s.match(/^(\d+)\s+(\d{8,14})$/);

    if(uomIdx<0)return;
    let desc=first.slice(1,uomIdx).map(t=>t.s).join(" ");
    const nums=first.slice(uomIdx+1).map(t=>t.s).filter(mtpoIsNum).map(mtpoNum);
    const caseLot=nums[0]||0,qty=nums[1]||0;
    let boxes=0,done=false;
    for(let j=a+1;j<end;j++){
      for(const t of lines[j].items){
        if(boxes===0&&/^\d+$/.test(t.s)&&t.x>=225&&t.x<=295)boxes=Number(t.s);
        if(!done&&t.x>=100&&t.x<225){
          const idx=t.s.indexOf("[HSN");
          if(idx>=0){const part=t.s.slice(0,idx).trim();if(part)desc+=" "+part;done=true;}
          else if(!/^Code:/i.test(t.s)&&!/\/HRS\//.test(t.s))desc+=" "+t.s;
        }
      }
    }
    const note=(!boxes&&caseLot)?"Box column nahi mila, Qty/Case se nikala":"";
    if(!boxes&&caseLot)boxes=Math.round(qty/caseLot);
    items.push({codes:[m[2]],desc:desc.replace(/\s+/g," ").trim(),box:boxes,pcs:0,note});
  });
  const phone=lines.find(l=>l.items[0]&&l.items[0].x<40&&/^Phone$/i.test(l.items[0].s));
  const shipLines=lines.filter(l=>phone&&l.y>phone.y&&l.items.some(t=>t.x<420)).map(l=>l.items.filter(t=>t.x<420).map(t=>t.s).join(" "));
  const dcText=shipLines.join(" ");
  const loc=(shipLines.find(s=>/^ASL\s+WM\s+DC\b/i.test(s))||shipLines[1]||"").replace(/^ASL\s+WM\s+DC\s+/i,"").toUpperCase();
  const sum=items.reduce((s,i)=>s+i.box,0);
  const warn=[];
  if(expectedBoxes&&sum!==expectedBoxes)warn.push(`PO me Total Boxes ${expectedBoxes} likha hai par items ke box ka jod ${sum} aaya — check karo`);
  return{fmt:"Avenue (D-Mart)",poNo,poDate,delivery,deliveryNote:"",dcText,dcFallback:"AVENUE SUPERMART - "+loc,items,warn};
}
function parseVishalPo(lines){
  const poNo=mtpoGrab(lines,/PO\s*Number\s*:\s*(\d+)/);
  const poDate=mtpoGrab(lines,/PO\s*Creation\s*Date\s*:\s*(\d\d\.\d\d\.\d{4})/);
  const rowIdx=[];
  lines.forEach((l,i)=>{const f=l.items[0];if(f&&f.x<12&&/^\d{2,4}$/.test(f.s)&&l.items.some(t=>/^\d{8}$/.test(t.s)&&t.x>20&&t.x<45))rowIdx.push(i);});
  const stop=l=>/^Total Tax/.test(l.text);
  const items=[];const dates=[];const warn=[];
  rowIdx.forEach((a,k)=>{
    const end=mtpoBlockEnd(rowIdx,k,lines,stop);
    const first=lines[a].items;
    const e1=first.find(t=>/^\d{8}$/.test(t.s)&&t.x>20&&t.x<45);
    let ean=e1?e1.s:"";
    const nxt=lines[a+1]?lines[a+1].items:[];
    const e2=nxt.find(t=>/^\d{4,6}$/.test(t.s)&&t.x>20&&t.x<45);
    if(e2&&(ean+e2.s).length===13)ean+=e2.s;
    const art=(first.find(t=>/^\d{10}$/.test(t.s))||{}).s||"";
    let desc=first.filter(t=>t.x>=125&&t.x<260).map(t=>t.s).join(" ");
    for(let j=a+1;j<end;j++)desc+=" "+lines[j].items.filter(t=>t.x>=125&&t.x<260).map(t=>t.s).join(" ");
    const uomIdx=first.findIndex(t=>/^(Pack|PAC|PCS|EA|NOS|BOX)$/i.test(t.s));
    if(uomIdx<4)return;
    const order=mtpoNum(first[uomIdx-2].s),pack=mtpoNum(first[uomIdx-4].s);
    const dm=first.slice().reverse().find(t=>/^\d\d\.\d\d\.\d{4}$/.test(t.s));
    if(dm)dates.push(dm.s);
    const totBU=mtpoNum((first[uomIdx+2]||{}).s||0);
    if(totBU&&pack&&order&&totBU!==pack*order)warn.push(`${art||ean}: Tot BU (${totBU}) = Pack x Qty (${pack*order}) se match nahi hua`);
    items.push({codes:[ean,art].filter(Boolean),desc:desc.replace(/\s+/g," ").trim(),box:order,pcs:0,note:""});
  });
  const dIdx=lines.findIndex(l=>/Delivery\s*&\s*Billing\s*Address/i.test(l.text));
  const mIdx=lines.findIndex((l,i)=>i>dIdx&&l.items[0]&&/^MC$/.test(l.items[0].s));
  const shipLines=(dIdx>=0&&mIdx>dIdx?lines.slice(dIdx+1,mIdx):[]).map(l=>l.items.filter(t=>t.x<430).map(t=>t.s).join(" ")).filter(Boolean);
  const dcText=shipLines.join(" ");
  const lm=dcText.match(/DC\s*-\s*([A-Z0-9 ]+?)\)/i);
  const first2=dates.slice().sort((a,b)=>a.split(".").reverse().join("")<b.split(".").reverse().join("")?-1:1)[0]||"";
  return{fmt:"Vishal Mega Mart",poNo,poDate,delivery:first2,deliveryNote:"",dcText,dcFallback:"VISHAL MEGA MART LTD - "+(lm?lm[1].trim().toUpperCase():""),items,warn};
}
function parseStylePo(lines){
  const poNo=mtpoGrab(lines,/Order\s*No\.?\s*:\s*(\d{6,})/);
  const poDate=mtpoGrab(lines,/Order\s*Date\.?\s*:\s*(\d\d\.\d\d\.\d{4})/);
  const validTill=mtpoGrab(lines,/Valid\s*Till\.?\s*:\s*(\d\d\.\d\d\.\d{4})/);
  const rowIdx=[];
  lines.forEach((l,i)=>{const f=l.items[0];if(f&&f.x<30&&/^\d{14}$/.test(f.s))rowIdx.push(i);});
  const stop=l=>l.items[0]&&/^TOTAL$/.test(l.items[0].s);
  const setIdx=lines.findIndex(l=>/SET\s*ITEM/.test(l.text));
  const sets={};
  if(setIdx>=0)lines.slice(setIdx+1).forEach(l=>{const f=l.items[0];if(f&&f.x<30&&/^\d{10}$/.test(f.s)){const n=l.items.slice(1).map(t=>t.s).filter(mtpoIsNum).map(mtpoNum);if(n.length>=4)sets[f.s]={single:n[2],total:n[3]};}});
  const items=[];const warn=[];
  rowIdx.forEach((a,k)=>{
    const end=mtpoBlockEnd(rowIdx,k,lines,stop);
    const first=lines[a].items;
    const itemcode=first[0].s;
    const barcode=(first.find((t,j)=>j>=1&&/^\d{10}$/.test(t.s))||{}).s||"";
    const st=first.find(t=>t.x>=120&&t.x<180);
    let style=st?st.s.replace(/\s+MULTI$/i,""):"";
    for(let j=a+1;j<end;j++)lines[j].items.forEach(t=>{if(t.x>=120&&t.x<180)style+=" "+t.s;});
    style=style.replace(/\s+/g," ").trim();
    const size=(first.find(t=>t.x>=220&&t.x<300)||{}).s||"";
    const nums=first.filter(t=>t.x>=300&&mtpoIsNum(t.s)).map(t=>mtpoNum(t.s));
    const poQty=nums.length>=4?nums[3]:0;
    const sd=sets[barcode];
    let box=sd&&sd.total?sd.total:(sd&&sd.single?Math.round(poQty/sd.single):0);
    if(sd&&sd.single&&sd.total&&sd.single*sd.total!==poQty)warn.push(`${style}: PO Qty ${poQty} aur Set (${sd.single} x ${sd.total}) match nahi hua`);
    const name=style.replace(/^[A-Z]{2,5}-JIP/,"");
    items.push({codes:[barcode,itemcode].filter(Boolean),desc:(name+" "+size).trim()+" | "+style,box,pcs:poQty,note:""});
  });
  const shipIdx=lines.findIndex(l=>l.items.some(t=>/^Shipping To$/i.test(t.s)));
  const cinIdx=lines.findIndex(l=>l.items.some(t=>/^CIN\./.test(t.s)));
  const shipLines=(shipIdx>=0&&cinIdx>shipIdx?lines.slice(shipIdx+1,cinIdx):[]).map(l=>l.items.filter(t=>t.x>=290&&t.x<610).map(t=>t.s).join(" ")).filter(Boolean);
  return{fmt:"Baazar Style",poNo,poDate,delivery:validTill,deliveryNote:"Delivery Date = PO ki 'Valid Till' date li gayi hai",dcText:shipLines.join(" "),dcFallback:(shipLines[0]||"").toUpperCase(),items,warn};
}
function parseMtPoItems(items){
  const lines=mtpoGroupLines(items);
  const all=lines.map(l=>l.text).join("\n");
  if(/Set Barcode/i.test(all)&&/Itemcode/i.test(all))return parseStylePo(lines);
  if(/VISHAL MEGA MART/i.test(all)&&/Purchase Order Details/i.test(all))return parseVishalPo(lines);
  if(/PURCHASE ORDER New/i.test(all)||(/Lot\s*&/.test(all)&&/Avenue Supermarts/i.test(all)))return parseDmartPo(lines);
  return null;
}

function mtpoPickDc(dcText,fallback){
  const stop=new Set(["LTD","LIMITED","PVT","PRIVATE","THE","AND","LLP","DC","WM","ASL"]);
  const tok=s=>String(s||"").toUpperCase().split(/[^A-Z0-9]+/).filter(t=>t&&t.length>1&&!stop.has(t));
  const pt=tok(dcText);
  const names=[...new Set(state.mtPos.map(p=>p.dc).filter(Boolean))];
  let best=null,bestN=0;
  names.forEach(n=>{
    const dt=tok(n);
    if(!dt.length)return;
    if(dt.every(t=>pt.some(p=>p===t||p.startsWith(t)||t.startsWith(p)))&&dt.length>bestN){best=n;bestN=dt.length;}
  });
  return best?{dc:best,found:true}:{dc:fallback||"",found:false};
}
function mtpoMatchItem(line){
  const items=state.mtItems||[];
  for(const c of (line.codes||[])){
    const code=String(c).trim();
    if(!code)continue;
    const m=items.find(i=>String(i.eanNo||"").trim()===code||(i.aliases||[]).includes(code));
    if(m)return m;
  }
  const norm=s=>String(s||"").toUpperCase().replace(/(\d)\s*(ML|LTR|L|GM|G|KG|PCS|PC)\b/g,"$1").replace(/[^A-Z0-9.]+/g," ").trim();
  const toks=s=>norm(s).split(" ").filter(t=>t&&t!==".");
  const pt=new Set(toks(line.desc));
  let best=[],bestN=0;
  items.forEach(i=>{
    const mt=toks(i.itemDesc);
    if(!mt.length||!mt.every(t=>pt.has(t)))return;
    if(mt.length>bestN){best=[i];bestN=mt.length;}else if(mt.length===bestN)best.push(i);
  });
  return best.length===1?best[0]:null;
}

function mtpoAddLineToItems(line,mi){

  const pcs=line.pcs>0?line.pcs:(ppb>0?line.box*ppb:0);
  const ex=temp.mtPoItems.find(x=>x.mtItemId==mi.id);
  if(ex){ex.qtyBox=Number(ex.qtyBox||0)+line.box;ex.qtyPcs=Number(ex.qtyPcs||0)+pcs;return;}
  temp.mtPoItems.push({id:uid(),mtItemId:mi.id,itemDesc:mi.itemDesc,eanNo:mi.eanNo,pcsPerBox:mi.pcsPerBox,qtyBox:line.box,qtyPcs:pcs});
}

  async syncMtPoFromPdf(){

    catch(e){console.error(e);setSt('<span style="color:#c62828;font-weight:700">❌ PDF nahi padh paya: '+esc(e&&e.message?e.message:e)+'</span>');return;}

      const mi=mtpoMatchItem(line);
      if(mi){mtpoAddLineToItems(line,mi);if(!(Number(mi.pcsPerBox)>0)&&!(line.pcs>0))noPpb.push(mi.itemDesc);}
      else temp.mtPoUnmatched.push(line);

    const dcr=mtpoPickDc(parsed.dcText,parsed.dcFallback);
    const setVal=(id,v)=>{const el=document.getElementById(id);if(el)el.value=v;};
    setVal("mtpoNo",parsed.poNo||"");
    setVal("mtpoDate",mtpoToIso(parsed.poDate));
    setVal("mtpoDc",dcr.dc);
    setVal("mtpoDelivery",mtpoToIso(parsed.delivery));
    const dsp=document.getElementById("mtpoDispatch");if(dsp)dsp.style.borderColor="#e65100";
    const tbl=document.getElementById("mtpoItemsTable");if(tbl)tbl.innerHTML=mtPoItemsHtml();
    temp.mtPoSyncInfo={fmt:parsed.fmt,poNo:parsed.poNo,dc:dcr.dc,dcFound:dcr.found,noPpb,warn:parsed.warn||[],deliveryNote:parsed.deliveryNote||""};

  _mtPoUpcomingData(){
    const dispMap=buildMtDispMap();
    const divItems=getMtDivisionItemNames(temp.mtDivision);
    const upcoming=[],overdue=[];
    state.mtPos.forEach(po=>{
      if(isMtPoDispatched(po.id,dispMap)||isMtPoFullyCancelled(po))return;
      if(divItems&&!(po.items||[]).some(i=>divItems.has(i.itemDesc)))return;
      let pendBox=0;
      (po.items||[]).forEach(it=>{
        if(divItems&&!divItems.has(it.itemDesc))return;
        const d=dispMap[it.id]||{box:0,pcs:0};
        pendBox+=Math.max(0,Number(it.qtyBox||0)-d.box-Number(it.cancelledBox||0));
      });
      if(pendBox<=0)return;
      const days=po.deliveryDate?getDays(po.deliveryDate):null;
      const row={poNo:po.poNo,dc:po.dc,dispatchDate:po.dispatchDate,deliveryDate:po.deliveryDate,days,pendBox};
      if(days!==null&&days<0)overdue.push(row);else upcoming.push(row);
    });
    upcoming.sort((a,b)=>(a.days===null?1e9:a.days)-(b.days===null?1e9:b.days));
    overdue.sort((a,b)=>a.days-b.days);
    return{upcoming,overdue};
  },

    const ovTable=overdue.length?`<table class="tbl" style="width:100%;border-collapse:collapse"><thead><tr style="background:#b71c1c;color:#fff"><th>#</th><th>PO No.</th><th>DC</th><th>Delivery Date</th><th>Overdue</th><th style="text-align:right">Total Box (Pending)</th></tr></thead><tbody>${ovRows}</tbody><tfoot><tr style="background:#ffebee;font-weight:800"><td colspan="5" style="text-align:right">TOTAL</td><td style="text-align:right">${sum(overdue)}</td></tr></tfoot></table>`:`<div style="color:#999;text-align:center;padding:14px">Koi overdue delivery nahi hai 🎉</div>`;
    return`<h3 style="margin:0 0 8px 0;color:#1a237e">📅 Upcoming Delivery (${upcoming.length})</h3>${upTable}<h3 style="margin:22px 0 8px 0;color:#b71c1c">⏰ Overdue Delivery (${overdue.length})</h3>${ovTable}`;

    const poValue=Number(poValueRaw)||0;

    const headerRow=ws.addRow(headers);

      cell.border=thinBorder;
      cell.alignment={horizontal:"center",vertical:"middle"};
    });
    const dataRow=ws.addRow(rowVals);

// ── MT PENDING ────────────────────────────────────────────
// Check if MT PO is fully dispatched
function buildMtDispMap(){
  const dispMap={};
  state.mtDispatches.forEach(d=>(d.items||[]).forEach(i=>{
    const k=i.poItemId;
    if(!dispMap[k])dispMap[k]={box:0,pcs:0};
    dispMap[k].box+=Number(i.qtyBox||0);
    dispMap[k].pcs+=Number(i.qtyPcs||0);
  }));
  return dispMap;
}
function isMtPoDispatched(poId,dispMap) {
  const po = state.mtPos.find(p=>p.id==poId);
  if(!po) return false;
  if(po.manualFullDispatch) return true;
  if(!dispMap)dispMap=buildMtDispMap();
  if((po.items||[]).length&&isMtPoFullyCancelled(po))return false;return (po.items||[]).every(item=>{
    const disp=dispMap[item.id]||{box:0,pcs:0};
    const needB=Math.max(0,Number(item.qtyBox||0)-Number(item.cancelledBox||0)),needP=Math.max(0,Number(item.qtyPcs||0)-Number(item.cancelledPcs||0));return disp.box>=needB&&disp.pcs>=needP;
  });
}

function getMtPendingRows(){const dispMap=buildMtDispMap();return state.mtPos
    .filter(po=>!isMtPoDispatched(po.id,dispMap)) // Only pending POs
    .flatMap(po=>(po.items||[]).map(item=>{
      const disp=dispMap[item.id]||{box:0,pcs:0};
      const cancB=Number(item.cancelledBox||0),cancP=Number(item.cancelledPcs||0);
      const pB=Number(item.qtyBox||0)-disp.box-cancB,pP=Number(item.qtyPcs||0)-disp.pcs-cancP;
      const days=getDays(po.dispatchDate);
      return{poId:po.id,poNo:po.poNo,dc:po.dc,poDate:po.poDate,deliveryDate:po.deliveryDate,dispatchDate:po.dispatchDate,days,itemDesc:item.itemDesc,eanNo:item.eanNo,ordBox:item.qtyBox,ordPcs:item.qtyPcs,dispBox:disp.box,dispPcs:disp.pcs,cancelledBox:cancB,cancelledPcs:cancP,pendBox:Math.max(0,pB),pendPcs:Math.max(0,pP),itemId:item.id};
    })).filter(r=>r.pendBox>0||r.pendPcs>0);}
// ── MT DISPATCH ALERT (dispatch date within 2 days) ────────
function getMtDispatchAlerts(){
  const rows=getMtPendingRows();
  const grouped={};
  rows.forEach(r=>{
    if(r.days!=null&&r.days>=0&&r.days<=2){
      if(!grouped[r.poNo])grouped[r.poNo]={poNo:r.poNo,dc:r.dc,dispatchDate:r.dispatchDate,days:r.days,items:[]};
      grouped[r.poNo].items.push({itemDesc:r.itemDesc,pendBox:r.pendBox,pendPcs:r.pendPcs});
    }
  });
  return Object.values(grouped).sort((a,b)=>a.days-b.days);
}
function renderMtAlertBanner(){

    <span style="font-size:20px">⏰</span>

    <span style="font-size:12px;color:#555;flex:1">${alerts.map(a=>`${esc(a.poNo)} (${dayLabel(a.days)})`).join(", ")}</span>
    <button class="btn btn-sm" style="background:#e65100;color:#fff" onclick="App.emailMtDispatchAlert()">📧 Email Alert</button>
  </div>`;
}

function computeMtPendingTrackerData(filteredRows){
  const poMap={};
  filteredRows.forEach(r=>{
    if(!(Number(r.pendBox||0)>0||Number(r.pendPcs||0)>0))return;
    if(!poMap[r.poNo])poMap[r.poNo]={poNo:r.poNo,dc:r.dc,poDate:r.poDate,deliveryDate:r.deliveryDate,boxes:0,pieces:0,amount:0};
    const po=poMap[r.poNo];
    po.boxes+=Number(r.pendBox||0);
    po.pieces+=Number(r.pendPcs||0);
    const item=state.mtItems.find(it=>it.itemDesc===r.itemDesc);
    const rate=item?Number(item.basicPrice)||0:0;
    const gstPct=item?Number(item.gstRate)||0:0;
    const baseAmt=Number(r.pendPcs||0)*rate;
    po.amount+=baseAmt*(1+gstPct/100);
  });
  let list=Object.values(poMap).map(po=>({...po,sets:Math.round(po.pieces/2),days:getDays(po.deliveryDate)}));
  list.sort((a,b)=>(a.days??9999)-(b.days??9999));
  const totalPOs=list.length;
  const totalPieces=list.reduce((s,p)=>s+p.pieces,0);
  const totalBoxes=list.reduce((s,p)=>s+p.boxes,0);
  const totalAmount=list.reduce((s,p)=>s+p.amount,0);
  const totalSets=list.reduce((s,p)=>s+p.sets,0);
  const monthMap={};
  list.forEach(p=>{
    const mKey=p.deliveryDate?new Date(p.deliveryDate).toLocaleDateString("en-IN",{month:"long",year:"numeric"}):"Unknown";
    if(!monthMap[mKey])monthMap[mKey]={month:mKey,pos:0,sets:0,boxes:0,amount:0,_sortDate:p.deliveryDate};
    monthMap[mKey].pos++;monthMap[mKey].sets+=p.sets;monthMap[mKey].boxes+=p.boxes;monthMap[mKey].amount+=p.amount;
  });
  const months=Object.values(monthMap).sort((a,b)=>new Date(a._sortDate)-new Date(b._sortDate));
  return{list,months,totalPOs,totalPieces,totalBoxes,totalAmount,totalSets};
}

function getDcChainName(dc){return String(dc||"").split(" - ")[0].trim();}
function getMtDivisionItemNames(division){
  if(!division)return null;
  return new Set(state.mtItems.filter(i=>i.division===division).map(i=>i.itemDesc));
}
function mtDivisionSelectorHtml(onchangeFn){
  const div=temp.mtDivision||"";

    <option value="">-- All Divisions --</option>${state.mtDivisions.map(d=>`<option value="${esc(d)}" ${div===d?"selected":""}>${esc(d)}</option>`).join("")}
  </select>${div?`<span style="font-size:11px;color:#5e35b1">✓ Sirf ${esc(div)} ka data dikh raha hai</span>`:`<span style="font-size:11px;color:#888">Division select karo sirf uska data dekhne ke liye</span>`}</div>`;
}
function getMtItemStats(dateFrom,dateTo,chainFilter){
  const cf=chainFilter?chainFilter.trim().toLowerCase():"";
  const stats={};
  state.mtItems.forEach(item=>{
    const ppb=Number(item.pcsPerBox)||0;
    const toPcs=(box,pcs)=>{ const p=Number(pcs)||0; if(p>0)return p; return ppb>0?Number(box||0)*ppb:0; };
    const toBox=(pcs)=>ppb>0?Math.floor(Number(pcs||0)/ppb):0;

    let tPP=0;
    state.mtPos.forEach(po=>{
      if(dateFrom&&po.poDate<dateFrom)return;
      if(dateTo&&po.poDate>dateTo)return;
      if(cf&&getDcChainName(po.dc).toLowerCase()!==cf)return;
      (po.items||[]).forEach(pi=>{
        if(pi.mtItemId==item.id||pi.itemDesc===item.itemDesc){
          const gross=toPcs(pi.qtyBox,pi.qtyPcs);
          const canc=toPcs(pi.cancelledBox,pi.cancelledPcs);
          tPP+=Math.max(0,gross-canc);
        }
      });
    });

    let tDPreal=0;
    const dispByPo={};
    state.mtDispatches.forEach(d=>{
      (d.items||[]).forEach(di=>{
        if(di.itemDesc===item.itemDesc){
          const p=toPcs(di.qtyBox,di.qtyPcs);
          tDPreal+=p;
          dispByPo[d.poId]=(dispByPo[d.poId]||0)+p;
        }
      });
    });

    let manualGapP=0;
    state.mtPos.forEach(po=>{
      if(!po.manualFullDispatch)return;
      (po.items||[]).forEach(pi=>{
        if(pi.mtItemId==item.id||pi.itemDesc===item.itemDesc){
          const gross=toPcs(pi.qtyBox,pi.qtyPcs);
          const canc=toPcs(pi.cancelledBox,pi.cancelledPcs);
          const net=Math.max(0,gross-canc);
          const d=dispByPo[po.id]||0;
          manualGapP+=Math.max(0,net-d);
        }
      });
    });

    let tPrP=0;
    state.mtPackings.forEach(p=>{
      if(p.mtItemId==item.id){
        if(p.productionUnit==="Box")tPrP+=Number(p.productionQty||0)*ppb;
        else tPrP+=Number(p.productionQty||0);
      }
    });

    const stockP=Math.max(0,tPrP-tDPreal);
    const pendP=Math.max(0,tPP-tDPreal-manualGapP);
    const remP=Math.max(0,pendP-stockP); // Sirf utni hi production chahiye jitni Pending hai minus jo Godown me pehle se Stock hai

    stats[item.id]={
      tPB:toBox(tPP),tPP,
      tDB:toBox(tDPreal),tDP:tDPreal,
      tPrB:toBox(tPrP),tPrP,
      remB:toBox(remP),remP,
      pendB:toBox(pendP),pendP,
      stockB:toBox(stockP),stockP
    };
  });
  return stats;
}

  async downloadBackup(){
    const backup=await buildFullBackup();
    const json=JSON.stringify(backup,null,2);
    const ts=new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
    const fname=`JimitPetLLP-FY${FY.label}-Backup-${ts}.json`;
    // Mobile: pehle Share (WhatsApp / Drive / Files me save) try karo
    const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&window.innerWidth<900);
    if(isMobile&&navigator.share&&navigator.canShare){
      for(const mime of ["application/json","text/plain"]){
        try{
          const f=new File([json],fname,{type:mime});
          if(navigator.canShare({files:[f]})){
            await navigator.share({files:[f],title:"Jimit Pet LLP Backup"});
            showSyncPill("ok","Backup share ho gayi!",4000);
            return;
          }
        }catch(e){ if(e&&e.name==="AbortError")return; }
      }
    }
    // Normal download (PC / fallback)
    const blob=new Blob([json],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=fname; a.style.display="none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},60000);
    showSyncPill("ok","Backup file download ho gayi!",4000);
  },
  restoreBackup(evt){
    if(state.currentUser.role!=="admin"){alert("Sirf admin hi restore kar sakta hai");return;}
    const file=evt.target.files&&evt.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=async function(e){
      try{
        const parsed=JSON.parse(e.target.result);
        const data=parsed.data||parsed;
        if(!data||typeof data!=="object")throw new Error("Invalid backup file");
        const bfy=(parsed._meta&&parsed._meta.fy)||FY.base;
        const bReg=data.fy_registry||null;
        const msg1=bfy!==FY.label?`⚠️ Ye backup FY ${bfy} ka hai, aur aap abhi FY ${FY.label} me ho.\n\nRestore karoge to FY ${bfy} ka data (aur sab masters/users) is backup se OVERWRITE ho jayega. Sure ho?`:`⚠️ Ye backup file FY ${bfy} ka data load karega aur uska CURRENT data OVERWRITE kar dega. Kya aap sure hain?`;
        if(!confirm(msg1)){evt.target.value="";return;}
        if(!confirm("Final confirmation: Ye action UNDO nahi ho sakta. Continue karein?")){evt.target.value="";return;}
        let years=(bReg&&bReg.years&&bReg.years.length)?bReg.years.map(y=>({...y})):[];
        FY.years.forEach(y=>{ if(years.find(z=>z.label===y.label))return; if(!y.prefix&&years.some(z=>!z.prefix))return; years.push({...y}); });
        let main=years.find(y=>y.label===bfy);
        if(!main){main={label:bfy,prefix:"fy"+bfy+"__"};years.push(main);}
        for(const [dbk,val] of Object.entries(data)){
          if(val===undefined||dbk==="fy_registry"||dbk==="tombstones")continue;
          await DB.saveRaw(YEAR_DBKEYS.has(dbk)?(main.prefix||"")+dbk:dbk,val);
        }
        for(const [lab,obj] of Object.entries(parsed.fyData||{})){
          let y=years.find(z=>z.label===lab);
          if(!y){y={label:lab,prefix:(obj&&obj.prefix)||("fy"+lab+"__")};years.push(y);}
          for(const [k,v] of Object.entries((obj&&obj.data)||{})){ if(YEAR_DBKEYS.has(k))await DB.saveRaw((y.prefix||"")+k,v); }
        }
        await DB.saveRaw("fy_registry",{base:(bReg&&bReg.base)||FY.base,years});
        try{sessionStorage.setItem("jpl_fy",bfy);}catch(e){}
        if(data.tombstones) Tombstone.set(data.tombstones);
        alert("✅ Backup restore ho gaya! Page reload ho raha hai...");
        setTimeout(()=>location.reload(),500);
      }catch(err){
        alert("❌ Backup file load nahi ho payi: "+(err.message||"invalid file"));
      }
      evt.target.value="";
    };
    reader.readAsText(file);
  }
};

const MOULD_DEF_MATS=[{id:1,name:"PP",type:"powder",bagKg:25},{id:2,name:"CP",type:"powder",bagKg:25},{id:3,name:"LLDP",type:"powder",bagKg:25},{id:4,name:"LDPE",type:"powder",bagKg:25},{id:5,name:"MASTER BATCH",type:"mb",bagKg:25}];
const mldN=v=>{const n=parseFloat(v);return isFinite(n)?n:0;};
const mldF=(v,d)=>{d=(d==null?2:d);return (Math.round(v*Math.pow(10,d))/Math.pow(10,d)).toLocaleString("en-IN",{minimumFractionDigits:d,maximumFractionDigits:d});};

const mouldColCode=n=>{const c=(state.mouldColours||[]).find(x=>x.name===n);return c&&c.code?c.code:"";};
const mouldMat=id=>(state.mouldMats||[]).find(m=>m.id===id);

function mouldCalcLine(l){
  const it=(state.mouldItems||[]).find(i=>i.id===l.itemId);if(!it)return null;
  const pcs=mldN(l.pcs);
  const wp=(l.wastage===undefined||l.wastage===null||l.wastage==="")?mldN(it.wastePct):mldN(l.wastage);
  const baseKg=pcs*mldN(it.wtG)/1000*(1+wp/100);
  const mats={};
  (it.base||[]).forEach(b=>{if(b.matId)mats[b.matId]=(mats[b.matId]||0)+baseKg*mldN(b.pct)/100;});
  if(it.mbMatId&&mldN(it.mbPct)>0)mats[it.mbMatId]=(mats[it.mbMatId]||0)+baseKg*mldN(it.mbPct)/100;
  const per=mldN(it.colPer)||25;               // 1 colour packet kitne kg powder par
  const colPkt=l.colour?baseKg/per:0;          // is line ke colour ke packets
  const totKg=Object.values(mats).reduce((a,b)=>a+b,0);
  return {it,pcs,wp,baseKg,mats,colPkt,per,totKg};
}
function mouldTotals(lines){
  const mats={},cols={};let pcs=0,kg=0;
  (lines||[]).forEach(l=>{const c=mouldCalcLine(l);if(!c)return;pcs+=c.pcs;kg+=c.totKg;
    Object.entries(c.mats).forEach(([id,v])=>{mats[id]=(mats[id]||0)+v;});
    if(l.colour&&c.colPkt>0)cols[l.colour]=(cols[l.colour]||0)+c.colPkt;});
  const matList=(state.mouldMats||[]).filter(m=>mats[m.id]>0).map(m=>({name:m.name,kg:mats[m.id],bagKg:mldN(m.bagKg)||25}));
  const colList=Object.entries(cols).map(([name,v])=>({name,code:mouldColCode(name),pkt:v}));
  return {pcs,kg,matList,colList,matsById:mats};
}

}
function mouldBagTxt(kg,bagKg){

  return mldF(bags,3)+" bag"+(full>0?` <span style="font-size:11px;color:#555">(${full} full + ${mldF(Math.max(loose,0),2)} kg)</span>`:"");

function mouldRecipeTxt(it){
  const parts=(it.base||[]).map(b=>{const m=mouldMat(b.matId);return (m?m.name:"?")+" "+mldN(b.pct)+"%";});

  if(it.mbMatId&&mldN(it.mbPct)>0){const m=mouldMat(it.mbMatId);s+=` + ${m?m.name:"MB"} ${mldN(it.mbPct)}%`;}
