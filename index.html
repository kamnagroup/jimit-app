const MOULD_DEF_GROUPS=["Bowl","Cap","Lid","Ring","Bottom","Top","Lunch Box Lid","Lunch Box Base","Dibbi","Dibbi Lid"];
const MOULD_UNITS=["nos","gm","kg","ml","ltr","mtr"];
function mouldSplitCartons(c,n){const b=Math.floor(c/n),r=c-b*n;return Array.from({length:n},(_,i)=>b+(i<r?1:0));}
function mouldGroupList(extra){return [...new Set([...(state.mouldGroups||[]),...(extra?[extra]:[])])].filter(Boolean);}
function mouldProd(id){return (state.mouldProducts||[]).find(p=>p.id===id);}
function mouldPartColours(x,pl){
  const mode=x.colMode||"split";
  if(mode==="none")return [];
  if(mode.startsWith("fix:"))return [mode.slice(4)];
  const it=state.mouldItems.find(i=>i.id===x.itemId);
  const own=it?(it.colours||[]).map(id=>{const c=state.mouldColours.find(k=>k.id===id);return c?c.name:"";}).filter(Boolean):[];
  const ov=pl.colours||[];
  if(!ov.length)return own;                 // koi tick nahi = item ke apne colours
  const inter=own.filter(n=>ov.includes(n));
  return inter.length?inter:ov;
}
function mouldGenPlanLines(plan){
  temp.mould.lines=temp.mould.lines.filter(l=>l.planId!==plan.id);
  const pr=mouldProd(plan.productId);if(!pr)return;
  const P=mldN(pr.pcsPerCarton);
  (pr.lines||[]).filter(x=>x.type==="mould").forEach(x=>{
    const q=mldN(x.qty)||1,cols=mouldPartColours(x,plan);
    const tot=Math.round(plan.cartons*P*q);                       // is part ke total pcs
    const sh=cols.length?mouldSplitCartons(tot,cols.length):[tot]; // pcs / colours (bacha hua pehle colour ko)
    (cols.length?cols:[""]).forEach((c,i)=>{const pcs=sh[i];if(pcs>0)temp.mould.lines.push({id:uid(),itemId:x.itemId,colour:c,pcs,wastage:"",planId:plan.id});});
  });
}
function mouldAccTotals(plans){
  const map={},known=new Set(getAllStoreItemNames());
  (plans||[]).forEach(pl=>{
    const pr=mouldProd(pl.productId);if(!pr)return;
    const U=(pr.unitName||"Set").toLowerCase();
    const P=mldN(pr.pcsPerCarton),I=mldN(pr.pcsPerInner),sets=pl.cartons*P,inner=I>0?sets/I:0;
    (pr.lines||[]).filter(x=>x.type==="acc"&&x.name).forEach(x=>{
      const cnt=x.basis==="inner"?inner:(x.basis==="carton"?pl.cartons:sets);
      const lbl=x.basis==="inner"?"inner box":(x.basis==="carton"?"carton":U);
      const unit=x.unit||"nos",key=x.name+"|"+unit;
      if(!map[key])map[key]={name:x.name,unit,qty:0,f:[]};
      map[key].qty+=mldN(x.qty)*cnt;
      map[key].f.push(`${mldN(x.qty)} × ${mldF(cnt,x.basis==="carton"?0:2).replace(/\.00$/,"")} ${lbl}`);
    });
  });
  return Object.values(map).map(a=>{
    const need=a.unit==="nos"?Math.ceil(a.qty-1e-9):Math.round(a.qty*1000)/1000;
    const isK=known.has(a.name);const stock=isK?getStoreStock(a.name):null;
    return {name:a.name,unit:a.unit,qty:need,formula:a.f.join(" + "),stock,short:(isK&&stock<need)?need-Math.max(stock,0):0};
  });
}

      <td style="text-align:right;font-weight:700">${mldF(c.totKg,3)}</td>
      <td>${ro?"":`<button class="btn btn-sm btn-danger" onclick="App.mouldDelLine(${l.id})">✕</button>`}</td></tr>`;}).join("");
  const addRow=ro?"":`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#f3f4ff;border:1px solid #c5cae9;border-radius:8px;padding:10px 14px;margin-bottom:14px">

    <div><label class="lbl">Pcs to Make</label><input class="inp" type="number" min="0" id="mpPcs" style="margin:0;width:130px" placeholder="e.g. 60"></div>
    <div><label class="lbl">Wastage % (khali = item wala)</label><input class="inp" type="number" step="0.1" id="mpWaste" style="margin:0;width:120px"></div>
    <div style="flex-basis:100%"><label class="lbl">🎨 Colours tick karo — pcs sabme barabar bat jayenge (60 pcs, 3 colour → 20-20-20)</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px">${state.mouldColours.map(co=>`<label style="display:flex;align-items:center;gap:5px;font-size:13px;background:#fff;padding:6px 12px;border-radius:20px;border:1px solid #c5cae9;cursor:pointer"><input type="checkbox" class="mpCol" value="${co.id}"> ${esc(co.name)}${co.code?` <span style="color:#777;font-size:11px">(${esc(co.code)})</span>`:""}</label>`).join("")||`<span style="color:#999;font-size:12px">Pehle 🧪 Materials &amp; Colours me colour add karo (bina colour ke bhi chalega)</span>`}</div></div>

    <tbody>${rows||`<tr><td colspan="9" style="text-align:center;color:#999;padding:20px">Upar se item, colour aur pcs daal kar Add Line dabao</td></tr>`}</tbody></table></div>
    <div style="background:#fff3e0;border:1px solid #ffcc80;border-radius:8px;padding:8px 12px;font-size:12px;color:#e65100;margin:12px 0">ℹ️ Powder = Pcs × 1 pc weight × (1 + wastage%). Recipe % usi powder par lagta hai. Master Batch aur Colour % bhi usi powder weight par extra lagte hain.</div>
    <div class="card-title" style="border-radius:8px;margin-bottom:10px">📊 Total Requirement</div>
    ${mouldTotalsHtml(snap)}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${ro?"":`<button class="btn btn-success" onclick="App.mouldSave()">💾 Save Program</button><button class="btn btn-danger" onclick="App.mouldClear()">🗑 Clear</button>`}

function mouldShowModal(title,body){
  let o=document.getElementById("mouldModal");
  if(!o){o=document.createElement("div");o.id="mouldModal";o.className="modal-overlay";document.body.appendChild(o);}
  o.innerHTML=`<div class="modal-box"><div class="modal-head"><span style="font-weight:700;font-size:16px">${title}</span><button class="btn btn-sm" style="background:rgba(255,255,255,.2)" onclick="App.mouldClose()">✕ Close</button></div><div style="padding:18px">${body}</div></div>`;

function mouldBlankForm(){const p=(state.mouldMats||[]).find(m=>m.type==="powder");return{id:null,name:"",group:"",wtG:"",wastePct:"",base:[{matId:p?p.id:"",pct:100}],mbMatId:"",mbPct:"",colPer:25,colours:[]};}
function mouldSyncForm(){
  const f=temp.mouldForm;if(!f||!document.getElementById("mfName"))return;
  f.name=mldV("mfName");if(mldV("mfGroup")!=="__new__")f.group=mldV("mfGroup");f.wtG=mldV("mfWt");f.wastePct=mldV("mfWaste");
  f.mbMatId=mldV("mfMbMat")?+mldV("mfMbMat"):"";f.mbPct=mldV("mfMbPct");f.colPer=mldV("mfColPer");
  f.colours=(state.mouldColours||[]).filter(c=>{const e=document.getElementById("mfCol"+c.id);return e&&e.checked;}).map(c=>c.id);
  f.base=f.base.map((b,i)=>({matId:mldV("mfBM"+i)?+mldV("mfBM"+i):"",pct:mldV("mfBP"+i)}));
}

function mouldSnapPrintHtml(s){

  <table style="border-collapse:collapse;width:100%;margin-bottom:14px"><thead><tr><th ${th}>#</th><th ${th}>Item</th><th ${th}>Colour</th><th ${th}>Pcs</th><th ${th}>1 pc</th><th ${th}>Waste</th>${mnames.map(n=>`<th ${th}>${esc(n)} kg</th>`).join("")}<th ${th}>Colour pkt</th><th ${th}>Total kg</th></tr></thead><tbody>${rows}</tbody></table>
  ${(s.plans||[]).length?`<div style="font-size:13px;margin-bottom:10px"><b>📦 Product Plan:</b> ${s.plans.map(p=>esc(p.name)+" — "+p.cartons+" ctn ("+mldF(p.pcs,0)+" pcs)"+(p.colours.length?" ["+esc(p.colours.join(", "))+"]":"")).join(" &nbsp;|&nbsp; ")}</div>`:""}
  <h3 style="margin:0 0 6px">Total Requirement</h3>${mouldTotalsHtml(s,true)}`;
}

// 1 Aaj ki Packing · 2 Aaj ka Despatch (Gate Pass se) · 3 Pending Order Shortfall (category A-Z + party list)

function drRound(n){return Math.round((Number(n)||0)*100)/100;}
function drBuild(date){
  const norm=s=>String(s||"").trim().toLowerCase();
  const catMap=buildProductCategoryMap();
  const catOf=(name,fb)=>catMap[norm(name)]||fb||"Uncategorised";
  const az=(a,b)=>String(a).localeCompare(String(b),undefined,{sensitivity:"base"});
  // 1) Packing (date)
  const pk={};
  state.packings.filter(p=>p.date===date).forEach(p=>{const t=p.qtyType||"";const k=p.productName+"||"+t;if(!pk[k])pk[k]={name:p.productName,qtyType:t,cartons:0,qty:0};pk[k].cartons+=Number(p.cartons)||0;pk[k].qty+=Number(p.totalQty)||0;});
  const packing=Object.values(pk).sort((a,b)=>az(a.name,b.name)||az(a.qtyType,b.qtyType));
  // 2) Despatch — us din ke Gate Pass se (GP no. nahi, sirf summary)
  const despatch=[];
  (state.gatePasses||[]).filter(g=>g.date===date).forEach(g=>(g.rows||[]).forEach(r=>despatch.push({party:r.party||"",marka:r.marka||"",cartons:Number(r.cartons)||0,transport:r.transport||""})));
  despatch.sort((a,b)=>az(a.party,b.party));
  // 3) Pending order — sirf shortfall, category-wise A-Z, party list ke saath
  const pend=getPendingOrderRows().filter(r=>r.unit==="Cts");
  const parties={};
  pend.forEach(r=>{(parties[r.productName]=parties[r.productName]||new Set()).add(r.party||"");});
  const shortRows=OrderVsAvailableApp._ovaAgg("","").filter(r=>r.diff>0).map(r=>({name:r.product,category:catOf(r.product),pending:drRound(r.pendingQty),avail:drRound(r.availCartons),short:drRound(r.diff),parties:[...(parties[r.product]||[])].filter(Boolean).sort(az)}));
  const shortCats=drGroup(shortRows,az);
  // 4) Stock summary — category-wise A-Z
  const sm={};
  stockSummaryRows("","","").forEach(r=>{const k=r.productName;if(!sm[k])sm[k]={name:k,category:catOf(k,r.category),ctn:0};sm[k].ctn+=Number(r.pendingCartons)||0;});
  const stockRows=Object.values(sm).filter(r=>r.ctn>0).map(r=>({...r,ctn:drRound(r.ctn)}));
  const stockCats=drGroup(stockRows,az);
  // 5) MT pending production — division-wise
  const stats=getMtItemStats("","","");const byDiv={};
  state.mtItems.forEach(it=>{const s=stats[it.id]||{};const rb=s.remB||0,rp=s.remP||0;if(rb>0||rp>0){const d=it.division||"No Division";(byDiv[d]=byDiv[d]||[]).push({name:it.itemDesc,ean:it.eanNo||"",remB:drRound(rb),remP:drRound(rp)});}});
  const divSort=(a,b)=>a==="No Division"?1:b==="No Division"?-1:az(a,b);
  const mtDivs=Object.keys(byDiv).sort(divSort).map(d=>({division:d,items:byDiv[d].sort((a,b)=>az(a.name,b.name))}));
  // 6) MT pending despatch — division-wise (item ka PO − despatch)
  const byDiv2={};
  state.mtItems.forEach(it=>{const s=stats[it.id]||{};const pb=s.pendB||0,pp=s.pendP||0;if(pb>0||pp>0){const dv=it.division||"No Division";(byDiv2[dv]=byDiv2[dv]||[]).push({name:it.itemDesc,ean:it.eanNo||"",pendB:drRound(pb),pendP:drRound(pp)});}});
  const mtDesp=Object.keys(byDiv2).sort(divSort).map(dv=>({division:dv,items:byDiv2[dv].sort((a,b)=>az(a.name,b.name))}));
  return {date,packing,despatch,shortCats,stockCats,mtDivs,mtDesp};
}
function drQtyTotals(rows){
  const m={};rows.forEach(r=>{const t=r.qtyType||"";m[t]=(m[t]||0)+(Number(r.qty)||0);});
  return Object.keys(m).sort().map(t=>drRound(m[t])+" "+t).join(" + ");
}
function drGroup(rows,az){
  const m={};rows.forEach(r=>{(m[r.category]=m[r.category]||[]).push(r);});
  return Object.keys(m).sort((a,b)=>a==="Uncategorised"?1:b==="Uncategorised"?-1:az(a,b)).map(c=>({category:c,items:m[c].sort((a,b)=>az(a.name,b.name))}));
}

function drWhatsappText(d){
  const cap=(arr,n,f)=>{const a=arr.slice(0,n).map(f);if(arr.length>n)a.push("…aur "+(arr.length-n)+" aur (poori list PDF me)");return a;};
  const L=[`*Jimit Pet LLP — Daily Report*`,`📅 ${fmtDate(d.date)}`,""];
  const pkTot=d.packing.reduce((s,r)=>s+r.cartons,0);
  const pkQ=drQtyTotals(d.packing);
  L.push(`*📦 Aaj ki Packing* — ${drRound(pkTot)} Cts${pkQ?" ("+pkQ+")":""}`);
  L.push(...(d.packing.length?cap(d.packing,40,r=>`• ${r.name} — ${drRound(r.cartons)} Cts (${drRound(r.qty)} ${r.qtyType})`):["• Aaj koi packing nahi"]));
  L.push("",`*🚚 Aaj ka Despatch* — ${d.despatch.length}`);
  L.push(...(d.despatch.length?cap(d.despatch,40,r=>`• ${r.party} | ${r.marka||"—"} | ${r.transport||"—"}`):["• Aaj koi Gate Pass nahi"]));
  const sh=d.shortCats.flatMap(c=>c.items);
  L.push("",`*⏳ Pending Order — Shortfall* (${sh.length} item)`);
  L.push(...(sh.length?cap(sh,40,r=>`• ${r.name} — short ${r.short} Cts`):["• ✅ Koi shortfall nahi"]));
  L.push("","📎 Poori report (Stock Summary, MT Pending Production, MT Pending Despatch, Party list) PDF me attach hai.");
  return L.join("\n");
}

// ── PROGRAM STOCK CHECK (General Planner programs vs Inventory Stock) ──
function getProgramStockCheck(p){
  const wastage=(p.result&&p.result.wastage)||{};
  return Object.entries((p.result&&p.result.accTotals)||{}).map(([name,qty])=>{
    const need=Math.ceil(qty*100)/100;
    const pct=Number(wastage[name]||0);
    const final=Math.ceil(need*(1+pct/100));
    const stock=getStoreStock(name);
    return{name,unit:getAccessoryUnit(name),final,stock,ok:stock>=final};
  });
}
function programStockTableHtml(p){
  const rows=getProgramStockCheck(p);
  if(!rows.length)return`<div style="color:#999;text-align:center;padding:16px">Is program me koi accessory nahi hai</div>`;
  const okCount=rows.filter(r=>r.ok).length;
  const allOk=okCount===rows.length;
  const body=rows.map((r,i)=>`<tr><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td style="text-align:right">${esc(r.final)} ${esc(r.unit)}</td><td style="text-align:right">${esc(r.stock)} ${esc(r.unit)}</td><td style="text-align:center;font-size:20px">${r.ok?"✅":""}</td></tr>`).join("");
  const missing=(p.result&&p.result.missing)||[];
  return`<div style="margin-bottom:10px;padding:10px 14px;border-radius:8px;font-weight:700;background:${allOk?"#e8f5e9":"#fff3e0"};color:${allOk?"#2e7d32":"#e65100"}">${allOk?"✅ Saare accessories inventory me available hain":okCount+" / "+rows.length+" accessories inventory me available hain"}</div><table class="tbl" style="width:100%;border-collapse:collapse"><thead><tr style="background:#1a237e;color:#fff"><th>#</th><th>Accessory</th><th style="text-align:right">Required (Final Qty)</th><th style="text-align:right">Inventory Stock</th><th style="text-align:center">Available</th></tr></thead><tbody>${body}</tbody></table>${missing.length?`<div style="background:#ffebee;border:1px solid #ef9a9a;border-radius:8px;padding:10px 14px;font-size:12px;color:#c62828;margin-top:12px">⚠️ In items ka BOM set nahi hai, inki accessories shamil nahi hain: ${missing.map(esc).join(", ")}</div>`:""}`;
}

function getMinStock(name){const it=(state.storeItems||[]).find(i=>i.name===name&&Number(i.minStock)>0);return it?Number(it.minStock):10;}
function mtrDaysBetween(a,b){return Math.round((new Date(a)-new Date(b))/86400000);}
function getMtPoPendingSummary(){
  const byPo={};
  getMtPendingRows().forEach(r=>{
    if(!byPo[r.poId])byPo[r.poId]={poId:r.poId,poNo:r.poNo,dc:r.dc,poDate:r.poDate,deliveryDate:r.deliveryDate,dispatchDate:r.dispatchDate,pendBox:0,value:0};
    const mi=state.mtItems.find(m=>m.itemDesc===r.itemDesc);
    const bp=mi?Number(mi.basicPrice||0):0,g=mi?Number(mi.gstRate||0):0;
    byPo[r.poId].pendBox+=Number(r.pendBox||0);
    byPo[r.poId].value+=Number(r.pendPcs||0)*bp*(1+g/100);
  });
  return Object.values(byPo).map(p=>({...p,days:p.deliveryDate?getDays(p.deliveryDate):null}));
}
function getMtOverdueList(){return getMtPoPendingSummary().filter(p=>p.days!==null&&p.days<0).sort((a,b)=>a.days-b.days);}
function getMtOnTimeRows(from,to){
  const out=[];const dispMap=buildMtDispMap();
  state.mtPos.forEach(po=>{
    if(isMtPoFullyCancelled(po))return;
    const ds=state.mtDispatches.filter(d=>d.poId==po.id);
    if(!ds.length||!isMtPoDispatched(po.id,dispMap))return;
    const last=ds.map(d=>d.date).sort().slice(-1)[0];
    if(from&&last<from)return;
    if(to&&last>to)return;
    const planned=po.dispatchDate||po.deliveryDate;
    if(!planned)return;
    out.push({poNo:po.poNo,dc:po.dc,planned,delivery:po.deliveryDate,last,late:mtrDaysBetween(last,planned)});
  });
  return out;
}

function cmCompute(){
  const src=temp.cmSrc==="mt"?"mt":"gen";
  const boms=(src==="mt"?state.mtBomMaster:state.bomMaster)||[];
  const waste=Math.max(0,Number(temp.cmWaste)||0);
  const bal={},known=new Set();
  (state.storeLedger||[]).forEach(l=>{known.add(l.itemName);const q=Number(l.qty||0);bal[l.itemName]=(bal[l.itemName]||0)+((l.type==="plan_out"||l.type==="internal_issue")?-q:q);});
  const seen=new Set(),rows=[];
  boms.forEach(b=>{
    if(!b||!b.productName||seen.has(b.productName))return;
    seen.add(b.productName);
    const lines=(b.items||[]).filter(i=>i&&i.name&&Number(i.qtyPerBox)>0).map(i=>{
      const perBox=Number(i.qtyPerBox)*(1+waste/100);
      const stock=Math.round((bal[i.name]||0)*100)/100;
      const can=Math.floor(Math.max(0,stock)/perBox+1e-9);
      return{name:i.name,unit:i.unit||"",qtyPerBox:Number(i.qtyPerBox),perBox:Math.round(perBox*1000)/1000,stock,can,notInStore:!known.has(i.name)};
    });
    if(!lines.length){rows.push({product:b.productName,batch:b.batch||"",status:"empty",maxBoxes:0,lines:[],limiting:[]});return;}
    const maxBoxes=Math.min(...lines.map(l=>l.can));
    rows.push({product:b.productName,batch:b.batch||"",status:maxBoxes>0?"ready":"no",maxBoxes,lines,limiting:lines.filter(l=>l.can===maxBoxes)});
  });
  const ord={ready:0,no:1,empty:2};
  rows.sort((a,b)=>(ord[a.status]-ord[b.status])||(a.status==="ready"?b.maxBoxes-a.maxBoxes:0)||a.product.localeCompare(b.product));
  return rows;
}

function programStockCombinedHtml(){
  const progs=state.productionPlans.filter(p=>(p.status||"pending")==="pending");
  if(!progs.length)return`<div style="color:#999;text-align:center;padding:30px">Koi pending program nahi hai</div>`;
  const agg={};
  progs.forEach(p=>getProgramStockCheck(p).forEach(r=>{const a=agg[r.name]||(agg[r.name]={name:r.name,unit:r.unit,req:0,progs:[]});a.req+=r.final;if(!a.progs.includes(p.programNo))a.progs.push(p.programNo);}));
  const rows=Object.values(agg).map(a=>{const stock=getStoreStock(a.name);return{...a,stock,short:Math.max(0,Math.round((a.req-stock)*100)/100),ok:stock>=a.req};}).sort((a,b)=>b.short-a.short||a.name.localeCompare(b.name));
  const bad=rows.filter(r=>!r.ok).length;
  const body=rows.map((r,i)=>`<tr style="${r.ok?"":"background:#fff3e0"}"><td>${i+1}</td><td><b>${esc(r.name)}</b></td><td style="text-align:right">${esc(r.req)} ${esc(r.unit)}</td><td style="text-align:right">${esc(r.stock)} ${esc(r.unit)}</td><td style="text-align:right;font-weight:800;color:#c62828">${r.ok?"":esc(r.short)+" "+esc(r.unit)}</td><td style="text-align:center;font-size:20px">${r.ok?"✅":""}</td><td style="font-size:11px">${r.progs.map(esc).join(", ")}</td></tr>`).join("");
  return`<div style="margin-bottom:10px;padding:10px 14px;border-radius:8px;font-weight:700;background:${bad?"#fff3e0":"#e8f5e9"};color:${bad?"#e65100":"#2e7d32"}">${progs.length} pending program milakar: ${bad?bad+" accessory kam padegi ("+(rows.length-bad)+" theek)":"✅ saari accessories kaafi hain"}</div><div style="overflow-x:auto"><table class="tbl" style="width:100%;border-collapse:collapse"><thead><tr style="background:#1a237e;color:#fff"><th>#</th><th>Accessory</th><th style="text-align:right">Total Required</th><th style="text-align:right">Inventory Stock</th><th style="text-align:right">Kam Hai</th><th style="text-align:center">Available</th><th>Programs</th></tr></thead><tbody>${body}</tbody></table></div>`;

// ══ BATCH 2: Lot Report Step 2 (accessory Issued/Waste + stock adjust) + Production Report ══
function lotPlannedAcc(p){
  const wastage=(p.result&&p.result.wastage)||{};
  const isGeneral=state.productionPlans.some(x=>x.id===p.id);
  return Object.entries((p.result&&p.result.accTotals)||{}).map(([name,qty])=>{
    const need=Math.ceil(qty*100)/100;const pct=Number(wastage[name]||0);
    return{name,planned:Math.ceil(need*(1+pct/100)),unit:isGeneral?getAccessoryUnit(name):""};
  });
}
function lotEnsureAcc(p){
  const lot=p.lotReport;if(!lot)return;
  if(!lot.acc)lot.acc=[];
  lotPlannedAcc(p).forEach(pa=>{
    const ex=lot.acc.find(a=>a.name===pa.name);
    if(ex){ex.planned=pa.planned;ex.unit=pa.unit;}
    else lot.acc.push({name:pa.name,planned:pa.planned,unit:pa.unit,issued:"",waste:"",adjApplied:0});
  });
}
function lotAccessoryHtml(p){
  lotEnsureAcc(p);
  const acc=p.lotReport.acc;
  if(!acc.length)return"";
  const approved=p.status==="approved";
  const rows=acc.map((a,i)=>{
    const has=a.issued!==""&&a.issued!=null;
    const diff=has?Math.round((Number(a.issued)-Number(a.planned))*100)/100:null;
    const dTxt=diff===null?"—":diff===0?`<span style="color:#2e7d32;font-weight:700">✅ barabar</span>`:diff>0?`<span style="color:#c62828;font-weight:700">+${diff} zyada</span>`:`<span style="color:#e65100;font-weight:700">${Math.abs(diff)} kam</span>`;
    return`<tr><td><b>${esc(a.name)}</b></td><td style="text-align:right;font-weight:700;color:#1565c0">${esc(a.planned)}${a.unit?" "+esc(a.unit):""}</td><td><input class="inp" type="number" step="0.01" value="${esc(a.issued)}" placeholder="Store ne diya" style="width:120px;margin-bottom:0" onchange="App.updateLotAccField(${i},'issued',this.value)"></td><td>${dTxt}</td><td><input class="inp" type="number" step="0.01" value="${esc(a.waste)}" placeholder="Kharab" style="width:100px;margin-bottom:0" onchange="App.updateLotAccField(${i},'waste',this.value)"></td></tr>`;
  }).join("");
  return`<div style="margin-top:18px"><b style="font-size:14px;color:#1a237e">🧂 Accessories — Planned vs Store Issued</b><div style="background:${approved?"#e8f5e9":"#fff3e0"};border:1px solid ${approved?"#a5d6a7":"#ffcc80"};border-radius:6px;padding:8px 12px;font-size:12px;color:${approved?"#2e7d32":"#e65100"};margin:8px 0">${approved?"✅ Program Approved hai. Save karne par Planned aur Issued ka farak Inventory Stock me khud adjust ho jaayega (zyada diya to extra kat jaayega, kam diya to wapas judega).":"ℹ️ Program abhi Approved nahi hai. Issued/Waste likh sakte ho, par Inventory Stock tab hi adjust hoga jab program Approve ho jaaye aur aap Lot Report dobara Save karo."}</div><div style="overflow-x:auto"><table class="tbl"><thead><tr style="background:#37474f;color:#fff"><th>Accessory</th><th style="text-align:right">Planned (Final Qty)</th><th>Store Issued (Actual)</th><th>Farak</th><th>Waste (Kharab)</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function lotAccessoryPrintHtml(lot){
  const acc=((lot&&lot.acc)||[]).filter(a=>(a.issued!==""&&a.issued!=null)||(a.waste!==""&&a.waste!=null));
  if(!acc.length)return"";
  const rows=acc.map(a=>{const has=a.issued!==""&&a.issued!=null;const d=has?Math.round((Number(a.issued)-Number(a.planned))*100)/100:null;return`<tr><td>${esc(a.name)}</td><td style="text-align:right">${esc(a.planned)}${a.unit?" "+esc(a.unit):""}</td><td style="text-align:right">${has?esc(a.issued):"—"}</td><td style="text-align:right;font-weight:700">${d===null?"—":d>0?"+"+d:d}</td><td style="text-align:right">${a.waste!==""&&a.waste!=null?esc(a.waste):"—"}</td></tr>`;}).join("");
  return`<h3 style="margin:20px 0 6px 0">Accessories — Planned vs Issued</h3><table><thead><tr><th>Accessory</th><th style="text-align:right">Planned</th><th style="text-align:right">Issued</th><th style="text-align:right">Farak</th><th style="text-align:right">Waste</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function lotApplyStockAdjust(p){
  const lot=p.lotReport;
  if(!lot||!lot.acc||p.status!=="approved")return false;
  let changed=false;
  lot.acc.forEach(a=>{
    if(a.issued===""||a.issued==null)return;
    const issued=Number(a.issued);
    if(isNaN(issued))return;
    const desired=Math.round((Number(a.planned)-issued)*100)/100;
    const delta=Math.round((desired-Number(a.adjApplied||0))*100)/100;
    if(!delta)return;
    state.storeLedger.push({id:uid(),date:todayStr(),type:"manual_adjust",itemName:a.name,qty:delta,party:"Lot Report",location:"",refNo:p.programNo,remark:"Lot Report: planned "+a.planned+" vs issued "+issued,savedBy:state.currentUser?state.currentUser.name:"",_ts:Date.now()});
    a.adjApplied=desired;changed=true;
  });
  if(changed){persist("store_ledger",state.storeLedger);showSyncPill("ok","✅ Inventory Stock adjust ho gaya (Planned vs Issued)",4000);}
  return changed;
}

function stockAuditHtml(cartonQ,prodQ){
  const cq=String(cartonQ||"").trim(),pq=String(prodQ||"").trim().toLowerCase();
  if(!cq&&!pq)return`<div style="color:#999;text-align:center;padding:16px">Carton number ya product ka naam likho</div>`;
  const dispMap=buildDispMap();
  const recs=state.packings.filter(p=>(!cq||cartonMatch(p.cartonNo,cq))&&(!pq||String(p.productName||"").toLowerCase().includes(pq)));

  const keyCount={};state.packings.forEach(p=>{const k=p.cartonNo+"-"+p.productName;keyCount[k]=(keyCount[k]||0)+1;});
  const recRows=recs.map(p=>{
    const k=p.cartonNo+"-"+p.productName;const disp=dispMap[k]||0;const rem=p.totalQty-disp;
    const flags=[];
    if(keyCount[k]>1)flags.push("⚠️ Is carton+product ki "+keyCount[k]+" packing entries hain");
    if(disp>p.totalQty)flags.push("⚠️ Packed se zyada dispatch ("+disp+" > "+p.totalQty+")");
    return`<tr><td><b>${esc(cartonLabel(p.cartonNo))}</b></td><td>${esc(p.productName)}</td><td>${esc(p.batchNo)}</td><td>${esc(p.category)}</td><td>${esc(fmtDate(p.date))}</td><td style="text-align:right">${esc(p.totalQty)}</td><td style="text-align:right">${esc(disp)}</td><td style="text-align:right;font-weight:800;color:${rem>0?"#2e7d32":"#c62828"}">${esc(rem)}</td><td style="text-align:center">${rem>0?"✅":"—"}</td><td style="font-size:11px;color:#c62828">${flags.join("<br>")||"—"}</td></tr>`;
  }).join("");
  const groups={};
  recs.forEach(p=>{groups[`${p.batchNo}||${p.productName}||${p.category}||${p.qtyType}`]=1;});
  const grpRows=Object.keys(groups).map(gk=>{
    const [b,pn,cat,qt]=gk.split("||");
    const members=state.packings.filter(p=>`${p.batchNo}||${p.productName}||${p.category}||${p.qtyType}`===gk);
    let tot=0,dsp=0,pos=0;const over=[];
    members.forEach(p=>{const d=dispMap[p.cartonNo+"-"+p.productName]||0;tot+=p.totalQty;dsp+=d;pos+=Math.max(0,p.totalQty-d);if(d>p.totalQty)over.push("#"+p.cartonNo+" ("+(d-p.totalQty)+" zyada)");});

const inr=n=>"₹"+(Number(n)||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const r2=n=>Math.round((Number(n)||0)*100)/100;
function accDays(a,b){if(!a||!b)return 0;return Math.round((Date.parse(b+"T00:00:00Z")-Date.parse(a+"T00:00:00Z"))/86400000);}
function accAddDays(d,n){const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+Number(n||0));return x.toISOString().slice(0,10);}

function accEnsureParty(name,kind){

  p={id:uid(),name:String(name).trim(),type:(kind==="sale"||kind==="receipt")?"Customer":"Supplier",state:"",gstin:"",city:"",phone:"",creditDays:30,openAmt:0,openSide:"recv",createdAt:nowStr(),createdBy:state.currentUser?state.currentUser.name:""};
  state.parties.push(p);persist("parties",state.parties);return p;

// side: "recv" (lene wale: sale bill − receipt) | "pay" (dene wale: purchase bill − payment)
// Paisa pehle opening ko, phir sabse purane bill ko cutta hai (FIFO).
function accCompute(side,asOf,cut,excl){
  const kind=side==="recv"?"sale":"purchase",pk=side==="recv"?"receipt":"payment";
  const m={};
  const mk=(n,p)=>({party:p||null,name:n,state:(p&&p.state)||"",opening:0,billed:0,paid:0,bills:[],pays:[]});
  (state.parties||[]).forEach(p=>{m[p.name]=mk(p.name,p);if(p.openSide===side)m[p.name].opening=r2(p.openAmt);});
  const ens=n=>m[n]||(m[n]=mk(n,null));
  (state.accBills||[]).filter(b=>!b.void&&b.kind===kind&&(!cut||b.date<=asOf)).forEach(b=>{const o=ens(b.partyName);o.billed=r2(o.billed+Number(b.total||0));o.bills.push(b);});
  (state.accReceipts||[]).filter(r=>!r.void&&r.kind===pk&&(!cut||r.date<=asOf)&&String(r.id)!==String(excl)).forEach(r=>{const o=ens(r.partyName);o.paid=r2(o.paid+Number(r.amount||0));o.pays.push(r);});
  return Object.values(m).filter(o=>o.opening||o.billed||o.paid).map(o=>{
    o.outstanding=r2(o.opening+o.billed-o.paid);
    // khaas bill se jodi hui rakam pehle us bill me, baaki paisa opening phir sabse purane bill me (FIFO)
    const ids=new Set(o.bills.map(b=>String(b.id))),spec={};
    o.pays.forEach(r=>(r.alloc||[]).forEach(a=>{const k=String(a.billId);if(ids.has(k))spec[k]=r2((spec[k]||0)+Number(a.amount||0));}));
    let free=o.paid;
    o.bills.forEach(b=>{const k=String(b.id),sp=Math.min(spec[k]||0,Number(b.total||0));spec[k]=sp;free=r2(free-sp);});
    if(free<0)free=0;
    const used=Math.min(free,o.opening),openLeft=r2(o.opening-used);let rem=r2(free-used);
    o.age={open:openLeft,b0:0,b30:0,b60:0,b90:0};o.overdue=0;o.billRows=[];
    o.bills.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||String(a.billNo).localeCompare(String(b.billNo))).forEach(b=>{
      const tot=Number(b.total||0),sp=spec[String(b.id)]||0,need=r2(tot-sp),take=Math.min(rem,need);rem=r2(rem-take);
      const bal=r2(need-take),days=accDays(b.date,asOf),od=accDays(b.dueDate||b.date,asOf);
      if(bal>0){
        if(days<=30)o.age.b0=r2(o.age.b0+bal);else if(days<=60)o.age.b30=r2(o.age.b30+bal);else if(days<=90)o.age.b60=r2(o.age.b60+bal);else o.age.b90=r2(o.age.b90+bal);
        if(od>0)o.overdue=r2(o.overdue+bal);
      }
      o.billRows.push({bill:b,applied:r2(sp+take),balance:bal,days,overdueDays:Math.max(0,od)});
    });
    o.advance=rem>0?rem:0;
    return o;
  });
}
function accBillMap(){const m={};["recv","pay"].forEach(sd=>accCompute(sd,todayStr()).forEach(o=>o.billRows.forEach(r=>{m[r.bill.id]=r;})));return m;}
function accStateGroups(list){
  const g={};
  list.filter(o=>o.outstanding>0).forEach(o=>{const k=o.state||"(State nahi)";const x=g[k]||(g[k]={state:k,parties:0,outstanding:0,overdue:0});x.parties++;x.outstanding=r2(x.outstanding+o.outstanding);x.overdue=r2(x.overdue+o.overdue);});
  return Object.values(g).sort((a,b)=>b.outstanding-a.outstanding);
}

  return(state.grns||[]).filter(g=>g.kind==="purchase"&&!used.has(String(g.id))).sort((a,b)=>String(b.date).localeCompare(String(a.date)));

  if(temp.abFrom)rows=rows.filter(b=>b.date>=temp.abFrom);if(temp.abTo)rows=rows.filter(b=>b.date<=temp.abTo);
  const balOf=b=>bm[b.id]?bm[b.id].balance:Number(b.total||0);

  const two=x=>x<20?ones[x]:tens[Math.floor(x/10)]+(x%10?" "+ones[x%10]:"");
  const three=x=>(x>=100?ones[Math.floor(x/100)]+" Hundred"+(x%100?" ":""):"")+(x%100?two(x%100):"");
  let w="";
  const cr=Math.floor(rupees/1e7),lk=Math.floor(rupees%1e7/1e5),th=Math.floor(rupees%1e5/1e3),rest=rupees%1e3;

}
const InvoiceApp={
  ivFilter(k,v){temp[k]=v;const el=document.getElementById("invList");if(el)el.innerHTML=invListHtml();},

function yeCompute(){
  const src=FY.label;
  const tgt=String(temp.yeTarget||fyNextLabel(src)).trim();
  const start=fyStartDate(tgt);
  const zeroNeg=temp.yeZeroNeg!==false;
  const by=state.currentUser?state.currentUser.name:"";
  const meta=()=>({savedAt:nowStr(),savedBy:by,_ts:Date.now()});
  let seq=0;const mk=()=>Date.now()*1000+(seq++);
  const lines=[];
  // 1. General Finish Goods (carton-wise bacha hua stock)
  const dm=buildDispMap(),packings=[],prodSet=new Set();
  let fgCartons=0;
  state.packings.forEach(p=>{
    const pq=Number(p.totalQty||0)-(dm[`${p.cartonNo}-${p.productName}`]||0);
    if(pq<=0)return;
    const qpc=Number(p.qtyPerCarton)||0,ct=qpc?Math.ceil(pq/qpc):Number(p.cartons||0);
    const cno=String(p.cartonNo==null?"":p.cartonNo).trim(),newNo=(cno&&cno.indexOf("/")<0)?cno+"/"+fyShort(src):cno;
    packings.push({...p,cartonNo:newNo,totalQty:pq,cartons:ct,remark:(p.remark?p.remark+" | ":"")+"Carry forward FY "+src,carryFwd:true,cfFrom:src,...meta()});
    prodSet.add(p.productName);fgCartons+=ct;
    lines.push(["Finish Goods",p.productName,"Carton "+newNo,pq]);
  });
  // 2. MT Finish Goods
  const mst=getMtItemStats(),mtPackings=[];
  let mtPcs=0;
  state.mtItems.forEach(it=>{
    const st=mst[it.id];if(!st||!(st.stockP>0))return;
    mtPackings.push({id:it.id,date:start,mtItemId:it.id,productionQty:st.stockP,productionUnit:"Pcs",batchNo:"OPENING",remark:"Carry forward FY "+src+" (opening stock)",itemDesc:it.itemDesc,eanNo:it.eanNo,pcsPerBox:it.pcsPerBox,carryFwd:true,cfFrom:src,...meta()});
    mtPcs+=st.stockP;
    lines.push(["MT Stock",it.itemDesc,"pcs",st.stockP]);
  });
  // 3. Accessories (store stock)
  const bal={};
  (state.storeLedger||[]).forEach(l=>{const q=Number(l.qty||0);bal[l.itemName]=(bal[l.itemName]||0)+((l.type==="plan_out"||l.type==="internal_issue")?-q:q);});
  const ledger=[];let negCount=0;
  Object.keys(bal).sort().forEach(n=>{
    const v=Math.round(bal[n]*100)/100;
    if(!v)return;
    if(v<0){negCount++;if(zeroNeg){lines.push(["Accessory (minus, zero se shuru)",n,"stock",v]);return;}}
    ledger.push({id:mk(),date:start,type:"manual_adjust",itemName:n,qty:v,party:"Year End Carry Forward",location:"",refNo:"OPENING FY "+tgt,remark:"Opening balance from FY "+src,carryFwd:true,savedBy:by,savedAt:nowStr()});
    lines.push(["Accessory",n,"stock",v]);
  });
  // 4. Pending General POs
  const byPo={};getPendingOrderRows().forEach(r=>{(byPo[r.poId]=byPo[r.poId]||[]).push(r);});
  const pos=[];
  Object.keys(byPo).forEach(pid=>{
    const po=state.purchaseOrders.find(x=>String(x.id)===String(pid));if(!po)return;
    pos.push({...po,items:byPo[pid].map(r=>{const o=(po.items||[]).find(i=>i.id===r.itemId)||{};return{...o,id:r.itemId,productName:r.productName,unit:r.unit,qty:r.pendingQty,pendingQty:r.pendingQty};}),remark:(po.remark?po.remark+" | ":"")+"Carry forward FY "+src,status:"active",carryFwd:true,cfFrom:src,...meta()});
    byPo[pid].forEach(r=>lines.push(["Pending PO (General)",po.poNo+" — "+po.partyName+" — "+r.productName,r.unit,r.pendingQty]));
  });
  // 5. Pending MT POs
  const byMt={};getMtPendingRows().forEach(r=>{(byMt[r.poId]=byMt[r.poId]||[]).push(r);});
  const mtPos=[];
  Object.keys(byMt).forEach(pid=>{
    const po=state.mtPos.find(x=>String(x.id)===String(pid));if(!po)return;
    mtPos.push({...po,items:byMt[pid].map(r=>{const o=(po.items||[]).find(i=>i.id===r.itemId)||{};return{...o,id:r.itemId,qtyBox:r.pendBox,qtyPcs:r.pendPcs,cancelledBox:0,cancelledPcs:0};}),status:"active",manualFullDispatch:false,carryFwd:true,cfFrom:src,...meta()});
    byMt[pid].forEach(r=>lines.push(["Pending PO (MT)",po.poNo+" — "+po.dc+" — "+r.itemDesc,"Box / Pcs",r.pendBox+" / "+r.pendPcs]));
  });
  return{src,tgt,start,zeroNeg,packings,mtPackings,ledger,pos,mtPos,lines,negCount,
    sum:{fgCartons,fgProducts:prodSet.size,fgRecords:packings.length,mtPcs,mtItems:mtPackings.length,accItems:ledger.length,poCount:pos.length,mtPoCount:mtPos.length}};
}

    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">${box("Finish Goods (General)",s.fgCartons+" Cts",s.fgProducts+" products, "+s.fgRecords+" carton records","#1a237e")}${box("MT Finish Goods",s.mtPcs+" pcs",s.mtItems+" items","#00838f")}${box("Accessories Stock",s.accItems+" items","opening balance","#6a1b9a")}${box("Pending PO (General)",s.poCount+" PO","pending qty ke saath","#e65100")}${box("Pending PO (MT)",s.mtPoCount+" PO","pending box/pcs ke saath","#2e7d32")}</div>
    <div style="font-size:12px;color:#666;margin-bottom:14px;line-height:1.6">❌ Naye year me <b>nahi</b> jayega: purani Packing/Dispatch/GRN history, Production Plans, Gate Pass. Wo FY ${esc(c.src)} me hi rahegi. Masters (Users, Item Master, BOM, Store Items) dono years me common hain.</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" style="background:#37474f" onclick="App.yeExport()">📥 Preview Export (CSV)</button><button class="btn btn-primary" style="padding:11px 24px;font-size:14px" ${bad?"disabled":""} onclick="App.yeRun()">🔒 Year End Karo &amp; Stock Transfer</button></div>
  </div></div>`;
}
async function yeRun(){
  if(!state.currentUser||state.currentUser.role!=="admin"){alert("Sirf admin Year End kar sakta hai");return;}
  const c=yeCompute(),s=c.sum;
  if(!fyValid(c.tgt)){alert("Naya year ka format galat hai. Aise likho: 2027-28");return;}
  if(c.tgt<=c.src){alert("Naya year "+c.src+" ke baad ka hona chahiye");return;}
  const ex=FY.years.find(y=>y.label===c.tgt);
  const msg=ex?`⚠️ FY ${c.tgt} pehle se bana hua hai.\n\nDobara chalane par us year ki sirf carry-forward wali entries (opening stock aur pending orders) naye hisaab se badlengi. FY ${c.tgt} me jo kaam hua hai wo nahi chhuega.\n\nContinue?`:`📅 FY ${c.src} ka stock aur pending orders FY ${c.tgt} me jayenge:\n\n• Finish Goods: ${s.fgCartons} Cts (${s.fgProducts} products)\n• MT Stock: ${s.mtPcs} pcs (${s.mtItems} items)\n• Accessories: ${s.accItems} items\n• Pending PO (General): ${s.poCount}\n• Pending PO (MT): ${s.mtPoCount}\n\nFY ${c.src} ka data jyon ka tyon rahega. Pehle ek backup bhi download hoga. Continue?`;
  if(!confirm(msg))return;
  try{ await App.downloadBackup(); }catch(e){}
  try{
    const pre=ex?(ex.prefix||""):("fy"+c.tgt+"__");
    const rd=async k=>{try{const v=await IDB.get("jpl_"+pre+k);return Array.isArray(v)?v:[];}catch(e){return [];}};
    const wr=(k,v)=>IDB.set("jpl_"+pre+k,v);
    const oPk=await rd("packings"),oMt=await rd("mt_packings"),oLg=await rd("store_ledger"),oPo=await rd("pos"),oMpo=await rd("mt_pos"),nDisp=await rd("dispatches"),nMtDisp=await rd("mt_dispatches");
    // carry-forward wali purani entries hatao, naye hisaab se dobara banao
    await wr("packings",[...oPk.filter(x=>!x.carryFwd),...c.packings]);
    await wr("mt_packings",[...oMt.filter(x=>!x.carryFwd),...c.mtPackings]);
    await wr("store_ledger",[...oLg.filter(x=>!x.carryFwd),...c.ledger]);
    // Pending POs: same id rakhte hain taaki naye year ke dispatch jude rahein
    const fPo=new Set(c.pos.map(p=>String(p.id))),fMp=new Set(c.mtPos.map(p=>String(p.id)));
    const usedGen=po=>nDisp.some(d=>(d.items||[]).some(di=>String(di.poNo!=null?di.poNo:d.poNo)===String(po.poNo)));
    const usedMt=po=>nMtDisp.some(d=>String(d.poId)===String(po.id));
    const poOut=[];
    oPo.forEach(p=>{ if(!p.carryFwd){poOut.push(p);return;} if(fPo.has(String(p.id)))return; if(usedGen(p))poOut.push({...p,items:(p.items||[]).map(i=>({...i,qty:0,pendingQty:0}))}); });
    c.pos.forEach(p=>poOut.push(p));
    const mpOut=[];
    oMpo.forEach(p=>{ if(!p.carryFwd){mpOut.push(p);return;} if(fMp.has(String(p.id)))return; if(usedMt(p))mpOut.push({...p,items:(p.items||[]).map(i=>({...i,qtyBox:0,qtyPcs:0,cancelledBox:0,cancelledPcs:0}))}); });
    c.mtPos.forEach(p=>mpOut.push(p));
    await wr("pos",poOut);
    await wr("mt_pos",mpOut);
    if(!ex)FY.years.push({label:c.tgt,prefix:pre,createdAt:new Date().toISOString(),carriedFrom:c.src});
    else ex.refreshedAt=new Date().toISOString();
    await DB.saveRaw("fy_registry",{base:FY.base,years:FY.years});
    temp.yeDone={tgt:c.tgt,src:c.src,rerun:!!ex,sum:s};
    renderTabContent();
  }catch(e){
    console.error(e);
    alert("❌ Year End me error aaya: "+(e&&e.message?e.message:e)+"\n\nPurana data safe hai. Dobara try karo.");
  }
}
const YearEndApp={
  yeSet(k,v){temp[k]=v;temp.yeDone=null;renderTabContent();},
  yeRun(){return yeRun();},
  yeExport(){
    const c=yeCompute();
    if(!c.lines.length){alert("Transfer karne ke liye kuch nahi mila");return;}
    exportCSV(["Section","Item","Detail","Qty"],c.lines,"year_end_preview_"+c.src+"_to_"+c.tgt+".csv");
  }
};
Object.assign(App,YearEndApp);
